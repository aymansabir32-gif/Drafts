<title>Amundi Explorateur</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { background:#04080f; display:flex; align-items:center; justify-content:center;
              width:100%; height:100%; overflow:hidden;
              font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }

           box-shadow:0 0 80px rgba(0,172,193,0.18); }
  #lang { position:fixed; top:11px; right:13px; z-index:10;
          background:rgba(8,18,28,0.85); color:#dff3ff;
          border:1px solid rgba(0,229,255,0.5); border-radius:9px;

<body>
<canvas id="c"></canvas>
<select id="lang" aria-label="Language / Langue"></select>
<script>
// ╔══════════════════════════════════════════════════════════════╗
//   AMUNDI EXPLORER — Educational Canvas Quiz Game · DELUXE
//   5 Zones · 19 Questions · ~10 minutes
//   Web Audio SFX + generative ambient music · entrance animations,
//   hover states, confetti, coins, score popups, ripples, screen shake.
//   HiDPI/Retina rendering · iOS-style emoji (Apple art + glyph fallback).
//   Per-zone imagery (photo drop-in + illustrated scenes).
//   Code Lyoko-style FX: digital transfer wipe, activated towers with
//   halo rings, scanner materialization & code rain.
// ╚══════════════════════════════════════════════════════════════╝

const C   = document.getElementById('c');
const ctx = C.getContext('2d');

// ── Responsive canvas (16:9, HiDPI-aware) ────────────────────
let DPR = 1;
function resize(){
  const ar=16/9, vw=window.innerWidth, vh=window.innerHeight;
  let cssW, cssH;
  if(vw/vh>ar){ cssH=vh; cssW=Math.floor(vh*ar); }
  else        { cssW=vw; cssH=Math.floor(vw/ar); }
  // cap at 2× so 3× phones don't blow up the per-frame fill cost
  DPR = Math.min(window.devicePixelRatio||1, 2);
  C.style.width = cssW+'px'; C.style.height = cssH+'px';   // CSS size = layout px
  C.width  = Math.round(cssW*DPR);                          // backing store = crisp px
  C.height = Math.round(cssH*DPR);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
}
resize();
window.addEventListener('resize', resize);
const W = () => C.width;
const H = () => C.height;
const u = f  => Math.round(H() * f);   // proportional unit

// ── Language state (8 locales, English default) ──────────────
const LANGS = [
  {code:'en',  label:'English'},
  {code:'fr',  label:'Français'},
  {code:'de',  label:'Deutsch'},
  {code:'es',  label:'Español'},
  {code:'it',  label:'Italiano'},
  {code:'ja',  label:'日本語'},
  {code:'yue', label:'廣東話'},   // Hong Kong (Traditional)
  {code:'zh',  label:'华语'}      // Singapore Mandarin (Simplified)
];
let LANG = 'en';
try { const s = localStorage.getItem('amundi_lang'); if(s && LANGS.some(l=>l.code===s)) LANG = s; } catch(e){}
let U;                                  // current UI string bundle (set each frame)
function tpl(s,o){ return (''+s).replace(/\{(\w+)\}/g,(_,k)=> (o && k in o) ? o[k] : ''); }

// ── Math / easing helpers ────────────────────────────────────
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const lerp  = (a,b,t)=> a+(b-a)*t;
// frame-rate independent smoothing toward a target
const lerpTo=(cur,target,dt,tau)=>{ cur=cur||0; return cur+(target-cur)*(1-Math.exp(-dt/Math.max(1,tau))); };
// hex (#rrggbb) + 0..1 alpha → #rrggbbaa
const hexA  =(hex,a)=> hex+Math.round(clamp(a,0,1)*255).toString(16).padStart(2,'0');
const ease = {
  outCubic:t=>1-Math.pow(1-t,3),
  inCubic :t=>t*t*t,
  inOutCubic:t=> t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2,
  outQuad :t=>1-(1-t)*(1-t),
  outBack :t=>{ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
};

// ── iOS-style emoji (Apple artwork via CDN, native glyph fallback) ──
// Set EMO.enabled=false to force native emojis, or change base/style to
// self-host a different set. Falls back to the platform glyph if a tile
// hasn't loaded — so it always works, and looks native on Apple devices.
const EMO = {
  base:'https://emojicdn.elk.sh/', style:'apple', enabled:true, cache:{},
  img(e){
    if(!this.enabled || typeof Image==='undefined') return null;
    let c=this.cache[e];
    if(!c){ c={img:new Image(),ok:false};
      c.img.onload =()=>{ c.ok = (c.img.width>0); };
      c.img.onerror=()=>{ c.ok=false; };
      c.img.src=this.base+encodeURIComponent(e)+'?style='+this.style;
      this.cache[e]=c; }
    return c.ok ? c.img : null;
  },
  preload(list){ list.forEach(e=>this.img(e)); }
};
let EMOJI_RE=null; try{ EMOJI_RE=/\p{Extended_Pictographic}/u; }catch(e){ EMOJI_RE=null; }
const EMOJI_SKIP = new Set(['▶','◀','▲','▼','◆','★','■','●']);   // keep as plain glyphs
function containsEmoji(s){ return EMOJI_RE ? EMOJI_RE.test(s) : false; }
function isEmojiCluster(g){ return !!EMOJI_RE && EMOJI_RE.test(g) && !EMOJI_SKIP.has(g); }
function splitRuns(str){
  const runs=[]; const pushT=s=>{ const l=runs[runs.length-1]; if(l&&l.t==='t') l.s+=s; else runs.push({t:'t',s}); };
  let clusters;
  if(typeof Intl!=='undefined' && Intl.Segmenter){
    clusters=[]; for(const sg of new Intl.Segmenter('en',{granularity:'grapheme'}).segment(str)) clusters.push(sg.segment);
  } else clusters=Array.from(str);
  clusters.forEach(g=> isEmojiCluster(g) ? runs.push({t:'e',s:g}) : pushT(g));
  return runs;
}
function curFontPx(){ const m=/(\d+(?:\.\d+)?)px/.exec(ctx.font); return m?parseFloat(m[1]):16; }
function drawEmoji(e,x,y,fs,baseline){
  const s=fs*1.18, off=(s-fs)/2;
  let top;
  if(baseline==='middle') top=y-s/2;
  else if(baseline==='top') top=y-off;
  else if(baseline==='bottom') top=y-s;
  else top=y-s*0.82;                                   // alphabetic
  const img=EMO.img(e);
  if(img) ctx.drawImage(img, x-off, top, s, s);
  else { const pa=ctx.textAlign; ctx.textAlign='left'; ctx['fillText'](e,x,y); ctx.textAlign=pa; }
}
// width of a possibly-emoji string in the current font
function measureEtext(str){
  str=''+str;
  if(!containsEmoji(str)) return ctx.measureText(str).width;
  const fs=curFontPx(); let total=0;
  splitRuns(str).forEach(r=> total += r.t==='e' ? fs : ctx.measureText(r.s).width);
  return total;
}
// emoji-aware fillText replacement — honours current font/align/baseline
function etext(str,x,y){
  str=''+str;
  if(!containsEmoji(str)){ ctx['fillText'](str,x,y); return; }
  const fs=curFontPx(), runs=splitRuns(str);
  let total=0; runs.forEach(r=> total += r.t==='e' ? fs : ctx.measureText(r.s).width);
  const al=ctx.textAlign;
  let cx = al==='center' ? x-total/2 : al==='right' ? x-total : x;
  ctx.textAlign='left';
  runs.forEach(r=>{
    if(r.t==='e'){ drawEmoji(r.s,cx,y,fs,ctx.textBaseline); cx+=fs; }
    else { ctx['fillText'](r.s,cx,y); cx+=ctx.measureText(r.s).width; }
  });
  ctx.textAlign=al;
}

// ── AUDIO ENGINE (Web Audio synth — no external files) ───────
const SFX = {
  ctx:null, master:null, delay:null, fb:null, musicGain:null,
  muted:false, started:false, nextBell:0,
  ensure(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted?0:0.9;
    this.master.connect(this.ctx.destination);
    // simple feedback-delay "space" bus
    this.delay = this.ctx.createDelay(); this.delay.delayTime.value=0.27;
    this.fb    = this.ctx.createGain(); this.fb.gain.value=0.34;
    const dlp  = this.ctx.createBiquadFilter(); dlp.type='lowpass'; dlp.frequency.value=2100;
    this.delay.connect(dlp); dlp.connect(this.fb); this.fb.connect(this.delay);
    this.delay.connect(this.master);
    // dedicated music sub-mix
    this.musicGain = this.ctx.createGain(); this.musicGain.gain.value=0;
    this.musicGain.connect(this.master);
  },
  setMuted(m){
    this.muted=m;
    if(this.master) this.master.gain.setTargetAtTime(m?0:0.9, this.ctx.currentTime, 0.04);
  },
  // generic oscillator "ping"
  tone(freq,o={}){
    if(!this.ctx) return;
    const t=this.ctx.currentTime+(o.when||0);
    const dur=o.dur??0.12, vol=o.vol??0.3;
    const osc=this.ctx.createOscillator(); osc.type=o.type||'sine';
    osc.frequency.setValueAtTime(freq,t);
    if(o.glide) osc.frequency.exponentialRampToValueAtTime(o.glide,t+dur);
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.connect(g); g.connect(this.master);
    if(o.delay){ const d=this.ctx.createGain(); d.gain.value=o.delay; g.connect(d); d.connect(this.delay); }
    osc.start(t); osc.stop(t+dur+0.05);
  },
  // filtered noise sweep
  noise(o={}){
    if(!this.ctx) return;
    const t=this.ctx.currentTime+(o.when||0), dur=o.dur??0.4;
    const buf=this.ctx.createBuffer(1,Math.ceil(this.ctx.sampleRate*dur),this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const bp=this.ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=o.q??0.8;
    bp.frequency.setValueAtTime(o.from??300,t);
    bp.frequency.exponentialRampToValueAtTime(o.to??3200,t+dur);
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(o.vol??0.15,t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    if(o.delay){ const dd=this.ctx.createGain(); dd.gain.value=o.delay; g.connect(dd); dd.connect(this.delay); }
    src.start(t); src.stop(t+dur);
  },
  // ── named cues ──
  click(){ this.tone(680,{type:'triangle',dur:0.07,vol:0.16}); this.tone(1020,{type:'sine',dur:0.05,vol:0.07,when:0.02}); },
  hover(){ this.tone(1320,{type:'sine',dur:0.035,vol:0.035}); },
  page(){  this.tone(540,{type:'sine',dur:0.09,vol:0.10,glide:680}); },
  start(){ this.tone(220,{type:'sawtooth',dur:0.5,vol:0.12,glide:880,delay:0.3});
           this.tone(660,{type:'sine',dur:0.4,vol:0.08,when:0.08,delay:0.4});
           this.noise({from:400,to:5000,vol:0.07,dur:0.5,delay:0.2}); },
  whoosh(){ this.noise({from:280,to:3600,vol:0.13,dur:0.42,q:0.7,delay:0.25});
            this.tone(900,{type:'sine',dur:0.4,vol:0.05,glide:200,delay:0.3}); },
  correct(streak=1){
    const base=[523.25,659.25,783.99,1046.5];           // C5 E5 G5 C6
    const mul=Math.pow(2, Math.min(streak-1,6)/12);      // rises with streak
    base.forEach((f,i)=> this.tone(f*mul,{type:'triangle',dur:0.18,vol:0.20,when:i*0.07,delay:0.35}));
  },
  wrong(){ this.tone(196,{type:'sawtooth',dur:0.28,vol:0.18,glide:98});
           this.tone(146,{type:'square',dur:0.30,vol:0.07,glide:73,when:0.02}); },
  tick(){  this.tone(1100,{type:'square',dur:0.03,vol:0.05}); },
  coin(){  this.tone(1318.5,{type:'sine',dur:0.06,vol:0.12});
           this.tone(1975.5,{type:'sine',dur:0.10,vol:0.10,when:0.05,delay:0.3}); },
  zoneComplete(){ [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>
                    this.tone(f,{type:'triangle',dur:0.16,vol:0.20,when:i*0.09,delay:0.4})); },
  victory(){
    [392,523.25,659.25,783.99,1046.5,1318.5,1568].forEach((f,i)=>
      this.tone(f,{type:'triangle',dur:0.2,vol:0.18,when:i*0.085,delay:0.45}));
    [523.25,659.25,783.99].forEach(f=> this.tone(f,{type:'sine',dur:1.4,vol:0.07,when:0.62,delay:0.5}));
  },
  // generative ambient pad + occasional pentatonic bells
  startAmbient(){
    if(!this.ctx || this.started) return; this.started=true;
    const t=this.ctx.currentTime;
    this.musicGain.gain.cancelScheduledValues(t);
    this.musicGain.gain.setValueAtTime(0.0001,t);
    this.musicGain.gain.linearRampToValueAtTime(0.5,t+4);
    // two low drones with slow tremolo
    [55,82.41].forEach((f,i)=>{
      const o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
      const g=this.ctx.createGain(); g.gain.value=0.06;
      const lfo=this.ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.07+i*0.03;
      const lg=this.ctx.createGain(); lg.gain.value=0.03;
      lfo.connect(lg); lg.connect(g.gain);
      o.connect(g); g.connect(this.musicGain); o.start(); lfo.start();
    });
    // warm filtered pad chord (A-minor-add9 feel)
    [110,130.81,164.81,196].forEach(f=>{
      const o=this.ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=f;
      const lp=this.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=320;
      const g=this.ctx.createGain(); g.gain.value=0.014;
      const lfo=this.ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.05;
      const lg=this.ctx.createGain(); lg.gain.value=120;
      lfo.connect(lg); lg.connect(lp.frequency);
      o.connect(lp); lp.connect(g); g.connect(this.musicGain); o.start(); lfo.start();
    });
    this.nextBell = t + 1.6;
  },
  updateAmbient(){
    if(!this.ctx || !this.started || this.muted) return;
    const t=this.ctx.currentTime;
    if(t>=this.nextBell){
      const scale=[523.25,587.33,659.25,783.99,880,1046.5];
      const f=scale[(Math.random()*scale.length)|0];
      const o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
      const g=this.ctx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.11,t+0.4);
      g.gain.exponentialRampToValueAtTime(0.0001,t+2.6);
      const ds=this.ctx.createGain(); ds.gain.value=0.5;
      o.connect(g); g.connect(this.musicGain); g.connect(ds); ds.connect(this.delay);
      o.start(t); o.stop(t+2.8);
      this.nextBell = t + 2.0 + Math.random()*2.6;
    }
  }
};

// ── Input (click + pointer hover + ripples) ──────────────────
let CLICK=null;
let PTR={x:-1,y:-1};
function canvasXY(ex,ey){ const r=C.getBoundingClientRect();
  return { x:(ex-r.left)*W()/r.width, y:(ey-r.top)*H()/r.height }; }
function setClick(ex,ey){
  const p=canvasXY(ex,ey); CLICK=p; PTR=p;
  ripple(p.x,p.y,'#7FE9FF');
  SFX.ensure(); SFX.startAmbient();
}
function setPtr(ex,ey){ PTR=canvasXY(ex,ey); }
C.addEventListener('click',     e=>setClick(e.clientX,e.clientY));
C.addEventListener('mousemove', e=>setPtr(e.clientX,e.clientY));
C.addEventListener('touchmove', e=>{ if(e.touches[0]) setPtr(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
C.addEventListener('touchend',  e=>{ e.preventDefault(); const t=e.changedTouches[0]; setClick(t.clientX,t.clientY); });
function hit(x,y,w,h){ return !!CLICK && CLICK.x>=x && CLICK.x<=x+w && CLICK.y>=y && CLICK.y<=y+h; }
function pointerIn(x,y,w,h){ return PTR.x>=x && PTR.x<=x+w && PTR.y>=y && PTR.y<=y+h; }
// hover state with rising-edge sound
const HOT={}, HOV={};
function hovered(id,is){ const p=HOV[id]||false; HOV[id]=is; if(is&&!p) SFX.hover(); return is; }
let wantPointer=false, dtGlobal=16, TNOW=0;

// ── Zone data (all content verified from Amundi documentation) ─
const ZONE_META = [
  {id:'hq',     emoji:'🏢', color:'#1565C0', accent:'#82B1FF'},
  {id:'mp',     emoji:'📊', color:'#2E7D32', accent:'#69F0AE', featured:true},
  {id:'inv',    emoji:'📈', color:'#6A1B9A', accent:'#CE93D8'},
  {id:'strat',  emoji:'🎯', color:'#B71C1C', accent:'#FF8A80'},
  {id:'global', emoji:'🌍', color:'#00695C', accent:'#80DEEA'}
];

const I18N = {

// ── Background particles (twinkling, glowing) ─────────────────
const P_COLS=['#00ACC1','#26C6DA','#4FC3F7','#80DEEA'];
const PTCLS = Array.from({length:64},()=>({
  x:Math.random(), y:Math.random(),
  r:1+Math.random()*3,
  dx:(Math.random()-0.5)*0.00012,
  dy:-0.00006-Math.random()*0.00011,
  a:0.12+Math.random()*0.30,
  c:P_COLS[(Math.random()*P_COLS.length)|0]
}));
function drawParticles(t){
  ctx.save();
  PTCLS.forEach(p=>{
    p.x+=p.dx; p.y+=p.dy;
    if(p.y<-0.02){ p.y=1.02; p.x=Math.random(); }
    if(p.x<-0.02||p.x>1.02) p.x=Math.random();
    const tw=0.6+0.4*Math.sin(t/1200+p.x*8+p.y*5);
    ctx.globalAlpha=p.a*tw;
    ctx.fillStyle=p.c; ctx.shadowColor=p.c; ctx.shadowBlur=p.r*2.4;
    ctx.beginPath();
    ctx.arc(p.x*W(), p.y*H(), p.r*H()/620, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.restore();
}

const CONF=[], POP=[], RIP=[];
const SHAKE={mag:0};
function shake(m){ SHAKE.mag=Math.max(SHAKE.mag,m); }
function confettiBurst(x,y,col,count=26){
  for(let i=0;i<count;i++){
    const ang=-Math.PI/2 + (Math.random()-0.5)*Math.PI*0.95;
    const sp=H()*(0.0006+Math.random()*0.0017);
    CONF.push({ x,y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - H()*0.0007,
      g:H()*0.0000048, rot:Math.random()*6.28, vrot:(Math.random()-0.5)*0.45,
      size:H()*(0.008+Math.random()*0.012),
      col: Math.random()<0.45?col:CONF_PAL[(Math.random()*CONF_PAL.length)|0],
      shape: Math.random()<0.5?'r':'c', t:0, life:1000+Math.random()*800 });
  }
  if(CONF.length>420) CONF.splice(0,CONF.length-420);
}
function confettiRain(n=5){
  for(let i=0;i<n;i++) CONF.push({
    x:Math.random()*W(), y:-u(0.03),
    vx:(Math.random()-0.5)*H()*0.0006, vy:H()*(0.0004+Math.random()*0.0009),
    g:H()*0.0000035, rot:Math.random()*6.28, vrot:(Math.random()-0.5)*0.4,
    size:H()*(0.008+Math.random()*0.012), col:CONF_PAL[(Math.random()*CONF_PAL.length)|0],
    shape:Math.random()<0.5?'r':'c', t:0, life:4200 });
  if(CONF.length>460) CONF.splice(0,CONF.length-460);
}
function drawConfetti(dt){
  for(let i=CONF.length-1;i>=0;i--){
    const c=CONF[i];
    c.t+=dt; c.vy+=c.g*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.rot+=c.vrot*dt*0.06;
    if(c.t>c.life || c.y>H()+u(0.06)){ CONF.splice(i,1); continue; }
    const a=1-clamp((c.t-(c.life-320))/320,0,1);
    ctx.save(); ctx.globalAlpha=a; ctx.translate(c.x,c.y); ctx.rotate(c.rot); ctx.fillStyle=c.col;
    if(c.shape==='r') ctx.fillRect(-c.size/2,-c.size/3,c.size,c.size*0.66);
    else { ctx.beginPath(); ctx.arc(0,0,c.size/2,0,6.2832); ctx.fill(); }
    ctx.restore();
  }
}
function popup(x,y,text,col,size){ POP.push({x,y,vy:-H()*0.0009,t:0,life:1100,text,col,size:size||u(0.04)}); }
function drawPopups(dt){
  for(let i=POP.length-1;i>=0;i--){
    const p=POP[i]; p.t+=dt; p.y+=p.vy*dt; p.vy*=Math.pow(0.94,dt/16);
    if(p.t>p.life){ POP.splice(i,1); continue; }
    const a=1-clamp((p.t-(p.life-400))/400,0,1);
    const s=ease.outBack(clamp(p.t/200,0,1));
    ctx.save(); ctx.globalAlpha=a; ctx.font=`900 ${p.size*s}px sans-serif`;
    ctx.fillStyle=p.col; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor=p.col; ctx.shadowBlur=u(0.02);
    etext(p.text,p.x,p.y); ctx.restore();
  }
}
function ripple(x,y,col){ RIP.push({x,y,t:0,life:520,col:col||'#7FE9FF'}); }
function drawRipples(dt){
  for(let i=RIP.length-1;i>=0;i--){
    const r=RIP[i]; r.t+=dt;
    if(r.t>r.life){ RIP.splice(i,1); continue; }
    const pr=r.t/r.life, rad=ease.outCubic(pr)*u(0.075);
    ctx.save(); ctx.globalAlpha=(1-pr)*0.5; ctx.strokeStyle=r.col; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(r.x,r.y,rad,0,6.2832); ctx.stroke(); ctx.restore();
  }
}

// ── Game-inspired FX: coins · shockwaves · embers · flash · punch ─
const COINS=[], SHOK=[], EMB=[];
const FLASH={a:0,col:'#ffffff'};
let PUNCH=0, scorePulse=0;
function flash(col,a){ FLASH.col=col; FLASH.a=Math.max(FLASH.a,a); }
function punch(v){ PUNCH=Math.min(1,Math.max(PUNCH,v)); }                 // camera kick
function shock(x,y,col,maxR){ SHOK.push({x,y,t:0,life:480,col,maxR:maxR||u(0.18)}); }
// Mario/mobile-style coins that arc toward the score counter
function spawnCoins(x,y,n){
  const tx=W()/2, ty=u(0.05);
  for(let i=0;i<n;i++) COINS.push({
    sx:x+(Math.random()-0.5)*u(0.07), sy:y+(Math.random()-0.5)*u(0.04),
    x, y, tx, ty, t:0, delay:i*38+Math.random()*60, life:560+Math.random()*200,
    arc:u(0.05)+Math.random()*u(0.09), spin:Math.random()*6.28, done:false });
}
function ember(x,y){ EMB.push({ x,y, vx:(Math.random()-0.5)*H()*0.0002,
  vy:-H()*0.0006-Math.random()*H()*0.0005, t:0, life:600+Math.random()*350,
  r:u(0.004)+Math.random()*u(0.004), col:Math.random()<0.5?'#FF9800':'#FFC107' }); }

function drawShocks(dt){
  for(let i=SHOK.length-1;i>=0;i--){
    const s=SHOK[i]; s.t+=dt; const p=s.t/s.life;
    if(p>=1){ SHOK.splice(i,1); continue; }
    const r=ease.outCubic(p)*s.maxR;
    ctx.save(); ctx.globalAlpha=(1-p)*0.85; ctx.strokeStyle=s.col;
    ctx.lineWidth=u(0.007)*(1-p)+1; ctx.shadowColor=s.col; ctx.shadowBlur=u(0.02);
    ctx.beginPath(); ctx.arc(s.x,s.y,r,0,6.2832); ctx.stroke(); ctx.restore();
  }
}
function drawCoins(dt){
  for(let i=COINS.length-1;i>=0;i--){
    const c=COINS[i]; c.t+=dt;
    const p=clamp((c.t-c.delay)/c.life,0,1), e=ease.inOutCubic(p);
    c.x=lerp(c.sx,c.tx,e); c.y=lerp(c.sy,c.ty,e)-Math.sin(p*Math.PI)*c.arc;
    if(p>=1){ scorePulse=1; SFX.coin(); flash('#FFE082',0.05); COINS.splice(i,1); continue; }
    const sp=c.t*0.018+c.spin, sxw=Math.abs(Math.cos(sp))*0.78+0.22, R=u(0.017);
    ctx.save(); ctx.translate(c.x,c.y); ctx.scale(sxw,1);
    const rg=ctx.createRadialGradient(-R*0.3,-R*0.3,R*0.1,0,0,R);
    rg.addColorStop(0,'#FFF3C4'); rg.addColorStop(0.5,'#FFC107'); rg.addColorStop(1,'#FF8F00');
    ctx.fillStyle=rg; ctx.shadowColor='#FFC107'; ctx.shadowBlur=u(0.018);
    ctx.beginPath(); ctx.arc(0,0,R,0,6.2832); ctx.fill();
    ctx.shadowBlur=0; ctx.strokeStyle='#FFE082'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.arc(0,0,R*0.58,0,6.2832); ctx.stroke();
    ctx.restore();
  }
}
function drawEmbers(dt){
  for(let i=EMB.length-1;i>=0;i--){
    const e=EMB[i]; e.t+=dt; e.x+=e.vx*dt; e.y+=e.vy*dt;
    if(e.t>e.life){ EMB.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=1-e.t/e.life; ctx.fillStyle=e.col;
    ctx.shadowColor=e.col; ctx.shadowBlur=u(0.015);
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,6.2832); ctx.fill(); ctx.restore();
  }
}
function drawFlash(){
  if(FLASH.a<=0.003) return;
  ctx.save(); ctx.globalAlpha=FLASH.a; ctx.fillStyle=FLASH.col; ctx.fillRect(0,0,W(),H()); ctx.restore();
}

// ── Synthwave perspective grid (Tron / Geometry Dash vibe) ───
function drawGrid(t,color,hy){
  hy=hy||H()*0.60;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.shadowColor=color; ctx.shadowBlur=u(0.012);
  ctx.strokeStyle=hexA(color,0.38); ctx.lineWidth=1.1;
  const vx=W()/2, spread=W()*1.35, N=12;
  for(let i=-N;i<=N;i++){                         // vertical lines fanning out
    const xb=vx+(i/N)*spread;
    ctx.beginPath(); ctx.moveTo(vx,hy); ctx.lineTo(xb,H()); ctx.stroke();
  }
  const speed=(t/1100)%1;
  for(let k=0;k<16;k++){                            // receding horizontals (scrolling)
    let f=(k+speed)/16; f=f*f;
    const y=hy+f*(H()-hy);
    ctx.globalAlpha=clamp(f*1.7,0,1)*0.4;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W(),y); ctx.stroke();
  }
  ctx.globalAlpha=1;
  const sg=ctx.createRadialGradient(vx,hy,0,vx,hy,W()*0.42);  // horizon sun glow
  sg.addColorStop(0,hexA(color,0.16)); sg.addColorStop(1,hexA(color,0));
  ctx.fillStyle=sg; ctx.fillRect(0,hy-W()*0.42,W(),W()*0.84);
  ctx.restore();
}

// ── Rotating god rays (victory flourish) ─────────────────────
function drawRays(t,cx,cy,color,count,maxR){
  count=count||12; maxR=maxR||H()*0.5;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.translate(cx,cy); ctx.rotate(t/5000);
  for(let i=0;i<count;i++){
    ctx.rotate(Math.PI*2/count);
    const g=ctx.createLinearGradient(0,0,0,-maxR);
    g.addColorStop(0,hexA(color,0.15)); g.addColorStop(1,hexA(color,0));
    ctx.fillStyle=g;
    const w=maxR*0.06*(0.6+0.4*Math.sin(t/600+i));
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-w,-maxR); ctx.lineTo(w,-maxR); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// ── Thematic scrolling stock-ticker tape (terminal twist) ────
// ticker tokens are per-language → U.ticker
function drawTicker(t,color){
  const bh=u(0.038), by=H()-bh;
  ctx.save();
  ctx.fillStyle='rgba(4,10,18,0.72)'; ctx.fillRect(0,by,W(),bh);
  ctx.strokeStyle=hexA(color,0.4); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,by); ctx.lineTo(W(),by); ctx.stroke();
  ctx.font=`bold ${u(0.02)}px monospace`; ctx.textBaseline='middle'; ctx.textAlign='left';
  ctx.fillStyle=color;
  const str=(U.ticker).join('   ◆   ')+'   ◆   ';
  const w=ctx.measureText(str).width, x=-((t/24)%w);
  etext(str,x,by+bh/2); etext(str,x+w,by+bh/2);
  ctx.restore();
}

// ── Imagery: real-photo drop-in + illustrated fallback scenes ─
// Want the REAL Amundi photos? Drop a URL or local path per key below
// (e.g. global:'assets/partners.jpg'); leave null to use the built-in
// illustrated scene. Real images render with the same Ken-Burns motion.
const MEDIA = { hero:null, hq:null, mp:null, inv:null, strat:null, global:null };
const IMG = {
  cache:{},
  get(key){
    const url=MEDIA[key];
    if(!url || typeof Image==='undefined') return null;
    let e=this.cache[key];
    if(!e){ e={img:new Image(),ok:false}; e.img.onload=()=>e.ok=true; e.img.onerror=()=>e.ok=false; e.img.src=url; this.cache[key]=e; }
    return e.ok ? e.img : null;
  }
};
function coverImage(img,x,y,w,h,t){               // cover-fit + slow Ken Burns
  const ar=img.width/img.height, tar=w/h, z=1.06+0.04*Math.sin(t/6000);
  let dw,dh; if(ar>tar){ dh=h*z; dw=dh*ar; } else { dw=w*z; dh=dw/ar; }
  ctx.drawImage(img, x+(w-dw)/2+Math.sin(t/8000)*w*0.02, y+(h-dh)/2+Math.cos(t/9000)*h*0.02, dw, dh);
}
function drawZoneMedia(z,x,y,w,h,r,t,o={}){
  ctx.save();
  rr(x,y,w,h,r); ctx.clip();
  const img=IMG.get(z.id);
  if(img) coverImage(img,x,y,w,h,t);
  else (SCENE[z.id]||sceneSkyline)(x,y,w,h,t);
  if(o.tint){ ctx.fillStyle=hexA(z.color,o.tint); ctx.fillRect(x,y,w,h); }
  if(o.scrim!==false){
    const g=ctx.createLinearGradient(0,y,0,y+h);
    g.addColorStop(0,`rgba(4,10,18,${o.top??0.06})`);
    g.addColorStop(1,`rgba(4,10,18,${o.bot??0.78})`);
    ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  }
  ctx.restore();
}

// 1) HQ + Paris skyline with the Eiffel Tower (image 1)
function sceneSkyline(x,y,w,h,t){
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'#9cc3e6'); g.addColorStop(0.6,'#cfe2f2'); g.addColorStop(1,'#a8c4dc');
  ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(255,255,255,0.35)';
  for(let i=0;i<3;i++){ const cx=x+((t/9000+i*0.4)%1.3-0.2)*w, cy=y+h*(0.16+i*0.09);
    ctx.beginPath(); ctx.ellipse(cx,cy,w*0.13,h*0.045,0,0,6.28); ctx.fill(); }
  const base=y+h*0.82;
  ctx.fillStyle='#7e93a8';
  for(let i=0;i<14;i++){ const bw=w*0.062, bx=x+i*bw, bh=h*(0.10+0.18*Math.abs(Math.sin(i*1.7)));
    ctx.fillRect(bx,base-bh,bw*0.92,bh); }
  ctx.fillStyle='#5b6f84'; ctx.fillRect(x,base,w,(y+h)-base);
  // Eiffel Tower
  const ex=x+w*0.17, eb=base, eh=h*0.44, ew=w*0.1;
  ctx.strokeStyle='#3d5269'; ctx.lineWidth=Math.max(1,h*0.006);
  ctx.beginPath();
  ctx.moveTo(ex-ew/2,eb); ctx.lineTo(ex,eb-eh); ctx.lineTo(ex+ew/2,eb);
  ctx.moveTo(ex-ew*0.34,eb-eh*0.42); ctx.lineTo(ex+ew*0.34,eb-eh*0.42);
  ctx.moveTo(ex-ew*0.18,eb-eh*0.7); ctx.lineTo(ex+ew*0.18,eb-eh*0.7);
  ctx.stroke();
  // glass HQ tower
  const tx=x+w*0.6, tw=w*0.33, th=h*0.62, tb=base;
  const tg=ctx.createLinearGradient(tx,tb-th,tx+tw,tb);
  tg.addColorStop(0,'#356f86'); tg.addColorStop(1,'#173a4d');
  ctx.fillStyle=tg; ctx.fillRect(tx,tb-th,tw,th);
  for(let r=0;r<9;r++)for(let c=0;c<6;c++){
    ctx.fillStyle=((r*7+c*3)%5===0)?'rgba(224,242,250,0.8)':'rgba(150,195,215,0.4)';
    ctx.fillRect(tx+w*0.012+c*(tw/6), tb-th+h*0.02+r*(th/9), tw/6-w*0.01, th/9-h*0.012);
  }
  ctx.fillStyle='#0a2a3a'; ctx.fillRect(tx,tb-th,tw,h*0.055);
  ctx.fillStyle='#eaf6ff'; ctx.font=`bold ${Math.round(h*0.045)}px sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  etext('Amundi', tx+tw/2, tb-th+h*0.028);
}
// 2) World Investment Forum stage (image 2)
function sceneForum(x,y,w,h,t,quiet){
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'#0a2a5a'); g.addColorStop(1,'#03102a');
  ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let i=0;i<3;i++){ const sx=x+w*(0.3+i*0.2);
    const lg=ctx.createLinearGradient(sx,y,sx,y+h*0.7);
    lg.addColorStop(0,'rgba(120,180,255,0.18)'); lg.addColorStop(1,'rgba(120,180,255,0)');
    ctx.fillStyle=lg; ctx.beginPath(); ctx.moveTo(sx,y);
    ctx.lineTo(sx-w*0.08,y+h*0.7); ctx.lineTo(sx+w*0.08,y+h*0.7); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  const cx=x+w/2, cy=y+h*0.42, rad=h*0.3;
  const rg=ctx.createRadialGradient(cx,cy,rad*0.2,cx,cy,rad);
  rg.addColorStop(0,'#2f6fd0'); rg.addColorStop(1,'#0d3a8a');
  ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(cx,cy,rad,0,6.28); ctx.fill();
  ctx.fillStyle='rgba(20,60,130,0.7)';
  ctx.fillRect(x+w*0.04,cy-h*0.16,w*0.17,h*0.24); ctx.fillRect(x+w*0.79,cy-h*0.16,w*0.17,h*0.24);
  if(!quiet){
    ctx.fillStyle='#eaf3ff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`bold ${Math.round(h*0.07)}px sans-serif`; etext('Amundi',cx,cy-h*0.03);
    ctx.font=`${Math.round(h*0.026)}px sans-serif`; etext(U.forum,cx,cy+h*0.05);
  }
  ctx.fillStyle='#0b1f44'; ctx.beginPath(); ctx.ellipse(cx,y+h*0.78,w*0.4,h*0.1,0,0,6.28); ctx.fill();
  ctx.fillStyle='#02060f';
  const heads=Math.max(8,Math.floor(w/(h*0.07)));
  for(let i=0;i<heads;i++){ const hx=x+(i+0.5)*(w/heads), hh=h*0.05+(i%3)*h*0.012, hy=y+h-hh*0.1;
    ctx.beginPath(); ctx.arc(hx,hy,hh*0.5,0,6.28); ctx.fill();
    ctx.fillRect(hx-hh*0.5,hy,hh,hh); }
}
// 3) Executive portrait (image 3) — generic, no real likeness
function scenePortrait(x,y,w,h,t){
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'#173a63'); g.addColorStop(1,'#0a1f3a');
  ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  ctx.save(); ctx.globalAlpha=0.22;
  for(let i=0;i<5;i++){ ctx.fillStyle=i%2?'#2a5a8a':'#3f7fb0'; ctx.fillRect(x+w*0.52,y+h*(0.08+i*0.17),w*0.5,h*0.09); }
  ctx.restore();
  const cx=x+w*0.42;
  ctx.fillStyle='#1b2a3c';
  ctx.beginPath(); ctx.moveTo(cx-w*0.27,y+h);
  ctx.quadraticCurveTo(cx-w*0.25,y+h*0.6,cx,y+h*0.6);
  ctx.quadraticCurveTo(cx+w*0.25,y+h*0.6,cx+w*0.27,y+h); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#e8eef5'; ctx.beginPath();
  ctx.moveTo(cx-w*0.06,y+h*0.64); ctx.lineTo(cx,y+h); ctx.lineTo(cx+w*0.06,y+h*0.64); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#2f6fd0'; ctx.beginPath();
  ctx.moveTo(cx-w*0.02,y+h*0.64); ctx.lineTo(cx,y+h*0.95); ctx.lineTo(cx+w*0.02,y+h*0.64); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#e3bd9a'; ctx.fillRect(cx-w*0.045,y+h*0.48,w*0.09,h*0.18);
  ctx.beginPath(); ctx.arc(cx,y+h*0.38,h*0.14,0,6.28); ctx.fill();
  ctx.fillStyle='#3a2c22'; ctx.beginPath(); ctx.arc(cx,y+h*0.35,h*0.145,Math.PI*1.04,Math.PI*1.96); ctx.fill();
}
// 4) "2028 Strategic Plan — Invest for the future" cube graphic (image 4)
function isoCube(cx,cy,s,top,left,right){
  ctx.beginPath(); ctx.moveTo(cx,cy-s); ctx.lineTo(cx+s,cy-s*0.5); ctx.lineTo(cx,cy); ctx.lineTo(cx-s,cy-s*0.5); ctx.closePath(); ctx.fillStyle=top; ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx-s,cy-s*0.5); ctx.lineTo(cx,cy); ctx.lineTo(cx,cy+s); ctx.lineTo(cx-s,cy+s*0.5); ctx.closePath(); ctx.fillStyle=left; ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx+s,cy-s*0.5); ctx.lineTo(cx,cy); ctx.lineTo(cx,cy+s); ctx.lineTo(cx+s,cy+s*0.5); ctx.closePath(); ctx.fillStyle=right; ctx.fill();
}
function sceneCube(x,y,w,h,t){
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'#13386e'); g.addColorStop(1,'#0a1f44');
  ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  const cubes=[[0.66,0.22,0.06],[0.78,0.34,0.05],[0.7,0.52,0.07],[0.87,0.5,0.05],[0.75,0.72,0.05],[0.9,0.26,0.04],[0.83,0.68,0.06]];
  cubes.forEach((c,i)=>isoCube(x+w*c[0], y+h*c[1]+Math.sin(t/1000+i)*h*0.012, Math.min(w,h)*c[2], '#2f5f9e','#244c80','#1b3a64'));
  isoCube(x+w*0.27, y+h*0.5, Math.min(w,h)*0.2, '#5b9bd5','#3f7fb0','#2e6090');
  ctx.fillStyle='#eaf3ff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`bold ${Math.round(h*0.075)}px sans-serif`; etext('2028',x+w*0.27,y+h*0.47);
  ctx.font=`${Math.round(h*0.03)}px sans-serif`; etext(U.stratPlan,x+w*0.27,y+h*0.56);
}
// 5) Subsidiary / partner logo wall (image 5)
function scenePartners(x,y,w,h,t){
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'#06403a'); g.addColorStop(1,'#02211f');
  ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(128,222,234,0.12)';

// ── Code Lyoko-style FX: activated tower · code rain · scan-in ─
// An activated Lyoko tower: vertical energy beam + rising halo rings.
function drawTower(cx,topY,botY,rad,t,color,act){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const beam=ctx.createLinearGradient(cx-rad,0,cx+rad,0);
  beam.addColorStop(0,hexA(color,0)); beam.addColorStop(0.5,hexA(color,act?0.5:0.3)); beam.addColorStop(1,hexA(color,0));
  ctx.fillStyle=beam; ctx.fillRect(cx-rad,topY,rad*2,botY-topY);
  ctx.strokeStyle=hexA(act?'#EAFFFF':color,0.85); ctx.lineWidth=Math.max(1,rad*0.05);
  ctx.shadowColor=color; ctx.shadowBlur=rad*0.7;
  ctx.beginPath(); ctx.moveTo(cx,topY); ctx.lineTo(cx,botY); ctx.stroke(); ctx.shadowBlur=0;
  const span=botY-topY, n=11;
  for(let i=0;i<n;i++){
    const f=((i/n)+(t/1400))%1;                       // rings rise then loop
    const ry=botY-f*span, rw=rad*(0.45+0.55*Math.sin(f*Math.PI)), a=(1-Math.abs(f-0.5)*2)*0.7;
    ctx.strokeStyle=hexA(act?'#9CFFFF':color,a); ctx.lineWidth=Math.max(1,rad*0.04);
    ctx.beginPath(); ctx.ellipse(cx,ry,rw,rw*0.26,0,0,6.2832); ctx.stroke();
  }
  ctx.restore();
}
// Falling digital "code rain" (the virtual world / digital sea)
const RAIN = Array.from({length:18},()=>({x:Math.random(), y:Math.random(), spd:0.3+Math.random()*0.9, len:4+(Math.random()*5|0)}));
function drawCodeRain(t,color,alpha){
  ctx.save();
  const cell=u(0.024); ctx.font=`${Math.round(cell*0.82)}px monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=color;
  RAIN.forEach((s,i)=>{
    const x=s.x*W(), head=((s.y+(t/4200)*s.spd)%1.2-0.2)*H();
    for(let k=0;k<s.len;k++){
      const yy=head-k*cell; if(yy<0||yy>H()) continue;
      ctx.globalAlpha=alpha*(k===0?1:(1-k/s.len)*0.55);
      ctx['fillText'](((i*7+k*13+((t/120)|0))%2)?'0':'1', x, yy);
    }

}
// Scanner materialization: glowing rings sweep up on screen entry
function drawScanIn(age){
  const dur=750; if(age<0||age>dur) return;
  const p=age/dur;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let i=0;i<3;i++){
    const pp=p-i*0.12; if(pp<=0||pp>=1) continue;
    const y=H()*(1-pp), a=(1-pp)*0.55, band=u(0.022);
    const g=ctx.createLinearGradient(0,y-band,0,y+band);
    g.addColorStop(0,hexA('#00E5FF',0)); g.addColorStop(0.5,hexA('#9CFFFF',a)); g.addColorStop(1,hexA('#00E5FF',0));
    ctx.fillStyle=g; ctx.fillRect(0,y-band,W(),band*2);
    ctx.strokeStyle=hexA('#EAFFFF',a); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W(),y); ctx.stroke();
  }
  ctx.restore();
}

// ── Screen-wipe transition system ────────────────────────────
const TR={ active:false, t:0, dur:560, half:false, next:null, color:'#00ACC1', cb:null };
function goto(screen,o={}){
  if(TR.active) return;
  TR.active=true; TR.t=0; TR.half=false; TR.next=screen;
  TR.color=o.color||'#00ACC1'; TR.cb=o.cb||null;
  SFX.whoosh();
}
function updateTransition(ts,dt){
  if(!TR.active) return;
  TR.t+=dt;
  if(!TR.half && TR.t>=TR.dur/2){
    TR.half=true;
    GS.screen=TR.next; GS.screenT0=ts; GS.qAnimT0=ts; GS.factAnimT0=ts;
    if(TR.cb) TR.cb();
  }
  if(TR.t>=TR.dur) TR.active=false;
}
function drawTransition(){
  if(!TR.active) return;
  const p=TR.t/TR.dur, e=ease.inOutCubic(p);
  const SK=u(0.12), pw=W()+SK, left=lerp(-pw,pw,e), ex=left+pw;
  ctx.save();
  // dark digital data-wall (parallelogram)
  ctx.beginPath();
  ctx.moveTo(left,0); ctx.lineTo(left+pw,0); ctx.lineTo(left+pw-SK,H()); ctx.lineTo(left-SK,H());
  ctx.closePath(); ctx.fillStyle='#04101a'; ctx.fill();
  // scanline texture inside the wall
  ctx.save(); ctx.clip();
  ctx.strokeStyle=hexA(TR.color,0.16); ctx.lineWidth=1;
  for(let y=0;y<H();y+=u(0.018)){ ctx.beginPath(); ctx.moveTo(left-SK,y); ctx.lineTo(left+pw,y); ctx.stroke(); }
  ctx.restore();
  // glowing scanner beam on the leading edge
  ctx.strokeStyle=hexA('#EAFFFF',0.9); ctx.lineWidth=u(0.006);
  ctx.shadowColor=TR.color; ctx.shadowBlur=u(0.05);
  ctx.beginPath(); ctx.moveTo(ex,0); ctx.lineTo(ex-SK,H()); ctx.stroke(); ctx.shadowBlur=0;
  // digitization voxels flickering along the beam
  ctx.fillStyle=TR.color;
  for(let i=0;i<26;i++){ const vy=(i/26)*H(), vx=ex-SK*(vy/H())+Math.sin(i*12.9+TR.t*0.05)*u(0.03);
    const sz=u(0.006)*(0.5+Math.random()); ctx.globalAlpha=0.3+0.5*Math.random(); ctx.fillRect(vx,vy,sz,sz); }
  ctx.globalAlpha=1;
  ctx.restore();
  // covered moment: an activated Lyoko tower + brand
  const cover=1-Math.abs(p-0.5)*2;
  if(cover>0.18){
    ctx.save(); ctx.globalAlpha=clamp((cover-0.18)/0.82,0,1);
    drawTower(W()/2, H()*0.08, H()*0.94, H()*0.16, TNOW, TR.color, true);
    ctx.font=`900 ${u(0.055)}px sans-serif`; ctx.fillStyle='#EAFFFF';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor=TR.color; ctx.shadowBlur=u(0.03);
    etext('AMUNDI', W()/2, H()/2);
    ctx.restore();
  }
}

// ── Drawing utilities ─────────────────────────────────────────
function bg(t,c1='#0b1a2c',c2='#05090f',glow=['#00ACC1','#3949AB']){
  const g=ctx.createLinearGradient(0,0,0,H());
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  ctx.fillStyle=g; ctx.fillRect(-u(0.06),-u(0.06),W()+u(0.12),H()+u(0.12));
  // drifting radial glow blobs (additive)
  ctx.save(); ctx.globalCompositeOperation='lighter';
  glow.forEach((col,i)=>{
    const ph=t/6000 + i*2.1;
    const gx=W()*(0.5+0.32*Math.sin(ph*0.8+i));
    const gy=H()*(0.5+0.30*Math.cos(ph*0.6+i*1.3));
    const rad=Math.max(W(),H())*0.5;
    const rg=ctx.createRadialGradient(gx,gy,0,gx,gy,rad);
    rg.addColorStop(0,hexA(col,0.22)); rg.addColorStop(1,hexA(col,0));
    ctx.fillStyle=rg; ctx.fillRect(0,0,W(),H());
  });
  ctx.restore();
}
function vignette(){
  const rg=ctx.createRadialGradient(W()/2,H()*0.5,H()*0.32,W()/2,H()*0.5,H()*0.95);
  rg.addColorStop(0,'rgba(0,0,0,0)'); rg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=rg; ctx.fillRect(0,0,W(),H());
}
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}
function wrap(str,maxW){
  str=''+str;
  // CJK has no spaces → allow breaking between CJK chars, keep Latin words whole.
  const isCJK=ch=>/[　-〿぀-ヿ㐀-䶿一-鿿豈-﫿＀-￯]/.test(ch);
  const units=[]; let buf='', sp=false;
  const flush=()=>{ if(buf){ units.push({s:buf,sp}); buf=''; sp=false; } };
  for(const ch of str){
    if(ch===' '){ flush(); sp=true; }
    else if(isCJK(ch)){ flush(); units.push({s:ch,sp}); sp=false; }
    else buf+=ch;
  }
  flush();
  const lines=[]; let line='';
  for(const un of units){
    const sep=(line && un.sp)?' ':'';
    const test=line+sep+un.s;
    if(line && ctx.measureText(test).width>maxW){ lines.push(line); line=un.s; }
    else line=test;
  }
  if(line) lines.push(line);
  return lines;
}
function drawCentered(str,cx,y,maxW,lh){
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='top';
  const lines=wrap(str,maxW);
  lines.forEach((l,i)=>etext(l,cx,y+i*lh));
  ctx.restore(); return lines.length*lh;
}
function glassCard(x,y,w,h,r,o={}){
  ctx.save();
  rr(x,y,w,h,r);
  if(o.shadow){ ctx.shadowColor=o.shadow; ctx.shadowBlur=u(0.04); ctx.shadowOffsetY=u(0.008); }
  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,o.c1||'rgba(18,34,50,0.72)');
  g.addColorStop(1,o.c2||'rgba(8,16,26,0.80)');
  ctx.fillStyle=g; ctx.fill();
  ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  rr(x,y,w,h,r); ctx.strokeStyle=o.border||'rgba(255,255,255,0.12)'; ctx.lineWidth=o.lw||1.5; ctx.stroke();
  ctx.restore();
}
// entrance fade factor (no transform → click hit-areas stay accurate)
function fadeIn(age,delay,dur){ return ease.outCubic(clamp((age-delay)/dur,0,1)); }
// entrance fade + slide (for non-interactive content)
function withEntry(age,delay,dur,fn){
  const a=ease.outCubic(clamp((age-delay)/dur,0,1));
  ctx.save(); ctx.globalAlpha*=a; ctx.translate(0,(1-a)*u(0.05)); fn(a); ctx.restore();
}

// reusable animated button — returns true on click
function drawButton(id,x,y,w,h,label,o={}){
  const r=o.r ?? Math.min(h/2,u(0.05));
  const is=pointerIn(x,y,w,h); hovered(id,is); if(is) wantPointer=true;
  HOT[id]=lerpTo(HOT[id],is?1:0,dtGlobal,90);
  const k=HOT[id];
  ctx.save();
  const cxp=x+w/2, cyp=y+h/2, sc=1+0.045*k;
  ctx.translate(cxp,cyp); ctx.scale(sc,sc); ctx.translate(-cxp,-cyp);
  ctx.shadowColor=o.glow||'#00ACC1'; ctx.shadowBlur=u(0.015)+u(0.05)*k; ctx.shadowOffsetY=u(0.006);
  rr(x,y,w,h,r);
  if(o.grad){ const g=ctx.createLinearGradient(x,y,x+w,y);
              o.grad.forEach((c,i)=>g.addColorStop(i/(o.grad.length-1),c)); ctx.fillStyle=g; }
  else ctx.fillStyle=o.fill||'#1565C0';
  ctx.fill();
  ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  // glossy top sheen
  rr(x+u(0.006),y+u(0.005),w-u(0.012),h*0.46,r*0.8);
  const gg=ctx.createLinearGradient(x,y,x,y+h*0.5);
  gg.addColorStop(0,'rgba(255,255,255,0.22)'); gg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gg; ctx.fill();
  // moving shimmer
  if(o.shimmer!==false){
    const sw=(TNOW/1500)%1, sxp=x+sw*(w*1.4)-w*0.2;
    ctx.save(); rr(x,y,w,h,r); ctx.clip();
    const sg=ctx.createLinearGradient(sxp-u(0.05),0,sxp+u(0.05),0);
    sg.addColorStop(0,'rgba(255,255,255,0)');
    sg.addColorStop(0.5,'rgba(255,255,255,'+(0.10+0.12*k)+')');
    sg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sg; ctx.fillRect(x,y,w,h); ctx.restore();
  }
  ctx.font=o.font||`bold ${u(0.04)}px sans-serif`;
  ctx.fillStyle=o.color||'#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  // auto-shrink the label so longer (e.g. French) text never overflows
  const maxw=w-u(0.05), lw=measureEtext(label);
  if(lw>maxw){ const npx=Math.max(8,curFontPx()*maxw/lw);
    ctx.font=ctx.font.replace(/(\d+(?:\.\d+)?)px/, npx.toFixed(1)+'px'); }
  etext(label,x+w/2,y+h/2+u(0.002));
  ctx.restore();
  const clicked=!!CLICK && hit(x,y,w,h) && !TR.active;
  if(clicked){ if(!o.silent) SFX.click(); ripple(CLICK.x,CLICK.y,o.glow||'#7FE9FF'); }
  return clicked;
}

function inMute(x,y){ const m=muteRect(); return x>=m.x&&x<=m.x+m.w&&y>=m.y&&y<=m.y+m.h; }

    etext(tpl(U.zonesDone,{n:GS.done.size}),u(0.025),u(0.094));
  });

  const mg=u(0.022), cH=u(0.3), row0Y=H()*0.16, row1Y=H()*0.575;
  const cW0=(W()-4*mg)/3, cW1=(W()-3*mg)/2;
  ZONES.forEach((z,i)=>{
    let cx,cy,cW;
    if(i<3){ cW=cW0; cx=mg+i*(cW+mg); cy=row0Y; }
    else   { cW=cW1; const j=i-3; cx=mg+j*(cW+mg); cy=row1Y; }
    const isDone=GS.done.has(z.id);
    withEntry(age,120+i*90,520,()=>{
      const id='card'+i;
      const is=!isDone && pointerIn(cx,cy,cW,cH); hovered(id,is); if(is) wantPointer=true;
      HOT[id]=lerpTo(HOT[id],is?1:0,dtGlobal,90); const k=HOT[id];
      ctx.save();
      const lift=k*u(0.012), cxp=cx+cW/2, cyp=cy+cH/2, sc=1+0.025*k;
      ctx.translate(cxp,cyp-lift); ctx.scale(sc,sc); ctx.translate(-cxp,-cyp);
      // hover glow base
      if(!isDone){ ctx.save(); rr(cx,cy,cW,cH,u(0.016));
        ctx.shadowColor=z.accent; ctx.shadowBlur=u(0.02)+u(0.04)*k; ctx.shadowOffsetY=u(0.008);
        ctx.fillStyle=z.color; ctx.fill(); ctx.restore(); }
      // per-zone photo / illustrated scene as the card background
      drawZoneMedia(z,cx,cy,cW,cH,u(0.016),t,{tint:isDone?0.6:0.24,top:0.06,bot:0.9});
      rr(cx,cy,cW,cH,u(0.016));
      ctx.strokeStyle=(z.featured&&!isDone)?z.accent:hexA('#ffffff',isDone?0.06:0.14+0.2*k);
      ctx.lineWidth=(z.featured&&!isDone)?3:1.5; ctx.stroke();
      // labels — dark shadow keeps them legible over imagery
      ctx.save(); ctx.shadowColor='rgba(0,0,0,0.75)'; ctx.shadowBlur=u(0.012); ctx.shadowOffsetY=u(0.002);
      ctx.globalAlpha*=isDone?0.5:1;
      const ebob=isDone?0:Math.sin(t/600+i)*u(0.004)*(0.5+k);
      ctx.font=`${u(0.058)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      etext(z.emoji,cx+cW/2,cy+cH*0.24+ebob);
      ctx.font=`bold ${u(0.034)}px sans-serif`; ctx.fillStyle='#fff';
      etext(z.name,cx+cW/2,cy+cH*0.55);
      ctx.font=`${u(0.022)}px sans-serif`; ctx.fillStyle=isDone?'#90A4AE':z.accent;
      etext(z.desc,cx+cW/2,cy+cH*0.67);
      ctx.font=`bold ${u(0.022)}px sans-serif`;
      if(isDone){ ctx.fillStyle='#69F0AE'; etext(`✓  ${GS.zoneScore[z.id]||0} pts`,cx+cW/2,cy+cH*0.81); }
      else { ctx.fillStyle='#ECEFF1'; etext(tpl(U.questionsN,{n:z.questions.length}),cx+cW/2,cy+cH*0.81); }
      ctx.restore();
      if(!isDone && k>0.05){
        ctx.globalAlpha*=k; ctx.fillStyle=z.accent; ctx.font=`bold ${u(0.02)}px sans-serif`;
        etext(U.enter,cx+cW/2,cy+cH*0.92);
      }
      if(z.featured&&!isDone){
        ctx.globalAlpha=1;
        const bw=u(0.13),bh=u(0.04),bx=cx+cW-bw-u(0.012),by=cy+u(0.012);
        const bp=0.6+0.4*Math.sin(t/300);
        rr(bx,by,bw,bh,5); ctx.fillStyle='#FFB300';
        ctx.shadowColor='#FFB300'; ctx.shadowBlur=u(0.02)*bp; ctx.fill(); ctx.shadowBlur=0;
        ctx.font=`bold ${u(0.02)}px sans-serif`; ctx.fillStyle='#071018';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        etext(U.featured,bx+bw/2,by+bh/2);
      }
      ctx.restore();
      if(!isDone && hit(cx,cy,cW,cH) && !TR.active){ prepZone(i); goto('fact',{color:z.color}); }
    });
  });

  if(GS.done.size===5 && !TR.active)
    goto('gameover',{color:'#FFB300',cb:()=>{ GS.celebrate=true; SFX.victory(); }});
}

// ── FACT SCREEN ───────────────────────────────────────────────
function drawFact(t){
  const z=ZONES[GS.zIdx], age=t-GS.screenT0;
  bg(t,'#0a1622','#05090f',[z.color,z.accent]); drawParticles(t);

  const barH=u(0.115);
  const g=ctx.createLinearGradient(0,0,W(),0);
  g.addColorStop(0,z.color); g.addColorStop(1,hexA(z.color,0.33));
  ctx.fillStyle=g; ctx.fillRect(0,0,W(),barH);
  withEntry(age,0,400,()=>{
    ctx.font=`${u(0.057)}px sans-serif`; ctx.textAlign='left'; ctx.textBaseline='middle';
    etext(z.emoji,u(0.025),barH/2);
    ctx.font=`bold ${u(0.044)}px sans-serif`; ctx.fillStyle='#fff';
    etext(z.name,u(0.11),barH/2);
    ctx.textAlign='right'; ctx.font=`${u(0.028)}px sans-serif`; ctx.fillStyle=z.accent;
    etext(tpl(U.factN,{i:GS.factIdx+1,n:z.facts.length}),W()-u(0.025),barH*0.72);
  });

  const padX=u(0.05), cW=W()-padX*2;
  // hero image band — per-zone photo / illustrated scene
  const hY=H()*0.15, hH=H()*0.3;
  ctx.save(); ctx.globalAlpha*=fadeIn(age,80,450);
  drawZoneMedia(z,padX,hY,cW,hH,u(0.018),t,{tint:0.12,top:0.04,bot:0.62});
  rr(padX,hY,cW,hH,u(0.018)); ctx.strokeStyle=hexA(z.accent,0.45); ctx.lineWidth=1.5; ctx.stroke();
  ctx.font=`bold ${u(0.026)}px sans-serif`; ctx.fillStyle='#fff';
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.shadowColor='rgba(0,0,0,0.85)'; ctx.shadowBlur=u(0.012);
  etext(z.emoji+'   '+z.desc, padX+u(0.025), hY+hH-u(0.028));
  ctx.restore();

  // fact text card
  const cY=H()*0.475, cH=H()*0.27;
  ctx.save(); ctx.globalAlpha*=fadeIn(age,160,450);
  glassCard(padX,cY,cW,cH,u(0.018),{border:hexA(z.accent,0.4),shadow:hexA(z.accent,0.3)});
  ctx.restore();

  // animated fact content (slides in on change)
  const fAge=t-GS.factAnimT0, fa=ease.outCubic(clamp(fAge/360,0,1));
  ctx.save(); ctx.globalAlpha*=fa*fadeIn(age,160,450); ctx.translate((1-fa)*u(0.06),0);
  ctx.font=`${u(0.05)}px sans-serif`; ctx.fillStyle='#fff';
  ctx.textAlign='center'; ctx.textBaseline='top';
  etext('💡',W()/2,cY+u(0.022));
  // fact body — shrink + re-wrap so dense (e.g. CJK) text never clips
  ctx.fillStyle='#CFD8DC';
  const fTxt=z.facts[GS.factIdx], fMaxW=cW-u(0.08), fAvailH=cH-u(0.095);
  let fFs=u(0.03), fLh=u(0.044);
  ctx.font=`${fFs}px sans-serif`; let fLines=wrap(fTxt,fMaxW);
  while(fLines.length*fLh>fAvailH && fFs>u(0.02)){ fFs-=1; fLh=Math.round(fFs*1.45); ctx.font=`${fFs}px sans-serif`; fLines=wrap(fTxt,fMaxW); }
  ctx.textAlign='center'; ctx.textBaseline='top';
  fLines.forEach((ln,i)=>etext(ln,W()/2,cY+u(0.07)+i*fLh));
  ctx.restore();

  // progress dots (active pulses)
  const dR=u(0.011), dY=H()*0.765, dGap=dR*3.2;
  const dotsX=W()/2-(z.facts.length-1)*dGap/2;
  for(let i=0;i<z.facts.length;i++){
    const act=i===GS.factIdx;
    ctx.beginPath();
    ctx.arc(dotsX+i*dGap,dY,dR*(act?1.15+0.15*Math.sin(t/300):1),0,Math.PI*2);
    ctx.fillStyle=i<=GS.factIdx?z.accent:'#1c2f3a';
    if(act){ ctx.shadowColor=z.accent; ctx.shadowBlur=u(0.02); }
    ctx.fill(); ctx.shadowBlur=0;
  }

  // nav button
  const isLast=GS.factIdx>=z.facts.length-1;
  const bW=u(0.48),bH=u(0.088),bX=(W()-bW)/2,bY=H()*0.81;
  ctx.save(); ctx.globalAlpha*=fadeIn(age,260,400);
  const clicked=drawButton('factnav',bX,bY,bW,bH,
    isLast?U.startQuiz:U.nextFact,
    isLast?{grad:['#00E5FF','#FFB300'],glow:'#00E5FF',color:'#04121b'}
          :{fill:z.color,glow:z.accent,color:'#fff'});
  ctx.restore();
  if(clicked){
    if(isLast){ GS.qIdx=0; GS.timer=15000; GS.phase='q'; GS.sel=-1; GS.streak=0; GS.lastTickSec=99; goto('quiz',{color:z.color}); }
    else      { GS.factIdx++; GS.factAnimT0=t; SFX.page(); }
  }
}

// ── QUIZ SCREEN ───────────────────────────────────────────────
function drawQuiz(t){
  const z=ZONES[GS.zIdx];
  // clamp: on the last question, phase 'done' briefly pushes qIdx past the
  // end while the wipe to the results screen plays — keep q valid so the
  // (covered) final frame never reads an undefined question.
  const q=z.questions[Math.min(GS.qIdx, z.questions.length-1)];
  bg(t,'#0a1622','#05090f',[z.color,z.accent]);

  // header
  const barH=u(0.10);
  const g=ctx.createLinearGradient(0,0,W(),0);
  g.addColorStop(0,z.color); g.addColorStop(1,hexA(z.color,0.27));
  ctx.fillStyle=g; ctx.fillRect(0,0,W(),barH);
  ctx.font=`bold ${u(0.034)}px sans-serif`; ctx.fillStyle='#fff';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  etext(z.emoji+'  '+z.name,u(0.025),barH/2);
  ctx.fillStyle=z.accent; ctx.textAlign='right';
  etext(tpl(U.qN,{i:GS.qIdx+1,n:z.questions.length}),W()-u(0.025),barH*0.74);
  // score (bumps when coins land) + combo
  ctx.save();
  const spz=1+0.4*scorePulse;
  ctx.font=`bold ${u(0.034*spz)}px sans-serif`;
  ctx.fillStyle=scorePulse>0.05?'#FFE082':'#FFB300';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(scorePulse>0.05){ ctx.shadowColor='#FFC107'; ctx.shadowBlur=u(0.03*scorePulse); }
  etext(`⭐ ${GS.totalScore+GS.zonePoints}`,W()/2,barH/2);
  ctx.restore();
  if(GS.streak>=2){
    const fire=GS.streak>=3;
    ctx.save();
    ctx.font=`bold ${u(fire?0.028:0.024)}px sans-serif`;
    ctx.fillStyle=fire?'#FF7043':'#FF8A65';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(fire){ ctx.shadowColor='#FF5722'; ctx.shadowBlur=u(0.022*(0.6+0.4*Math.sin(t/120))); }
    etext(`🔥 ${GS.streak} ${fire?U.streakFire:U.streakWord}`,W()/2,barH*0.84);
    ctx.restore();
    if(fire && Math.random()<0.5) ember(W()/2+(Math.random()-0.5)*u(0.24),barH*0.86);
  }

  // animated timer bar
  const tY=barH, tH=u(0.022);
  const frac=GS.phase==='q'?clamp(GS.timer/15000,0,1):0;
  ctx.fillStyle='#10202a'; ctx.fillRect(0,tY,W(),tH);
  const tc=frac>0.6?'#00E5FF':frac>0.3?'#FFB300':'#FF5252';
  if(frac>0){
    ctx.save(); ctx.beginPath(); ctx.rect(0,tY,W()*frac,tH); ctx.clip();
    const tg=ctx.createLinearGradient(0,0,W(),0);
    tg.addColorStop(0,tc); tg.addColorStop(1,hexA(tc,0.6));
    ctx.fillStyle=tg; ctx.fillRect(0,tY,W()*frac,tH);
    // moving diagonal stripes
    ctx.globalAlpha=0.16; ctx.fillStyle='#fff';
    const sp=u(0.028), off=(TNOW/14)%(sp*2);
    for(let xx=-off; xx<W()*frac; xx+=sp*2){
      ctx.beginPath(); ctx.moveTo(xx,tY); ctx.lineTo(xx+sp,tY);
      ctx.lineTo(xx+sp-tH,tY+tH); ctx.lineTo(xx-tH,tY+tH); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // glowing leading edge
    ctx.save(); ctx.fillStyle=tc; ctx.shadowColor=tc; ctx.shadowBlur=u(0.02);
    ctx.fillRect(W()*frac-2,tY,3,tH); ctx.restore();
  }
  // seconds text (heartbeat when low)
  const secs=Math.ceil(GS.timer/1000);
  const low=GS.phase==='q'&&GS.timer<=5000;
  const beat=low?1+0.18*Math.abs(Math.sin(t/140)):1;
  ctx.font=`bold ${u(0.026*beat)}px sans-serif`; ctx.fillStyle=tc;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  etext(`${GS.phase==='q'?secs:0}s`,W()/2,tY+tH/2);

  // question card
  const qAge=t-GS.qAnimT0;
  const qX=u(0.035), qY=tY+tH+u(0.018), qW=W()-qX*2, qH=u(0.155);
  ctx.save(); ctx.globalAlpha*=fadeIn(qAge,0,300);
  glassCard(qX,qY,qW,qH,u(0.014),{border:hexA(z.accent,0.35)});
  ctx.font=`bold ${u(0.034)}px sans-serif`; ctx.fillStyle='#E0F7FA';
  drawCentered(q.q,W()/2,qY+u(0.028),qW-u(0.06),u(0.050));
  ctx.restore();

  // options (2×2, staggered entrance + hover + feedback animation)
  const oMg=u(0.022), oW=(W()-3*oMg)/2, oH=u(0.095), oY=qY+qH+u(0.020);
  const LBLS=['A','B','C','D'];
  q.opts.forEach((opt,i)=>{
    const col=i%2, row=Math.floor(i/2);
    const ox=oMg+col*(oW+oMg), oy=oY+row*(oH+oMg);
    const intro=ease.outCubic(clamp((qAge-120-i*80)/340,0,1));
    const id='opt'+i;
    const is=GS.phase==='q' && pointerIn(ox,oy,oW,oH);
    if(GS.phase==='q'){ hovered(id,is); if(is) wantPointer=true; }
    HOT[id]=lerpTo(HOT[id],is?1:0,dtGlobal,90);
    let scale=lerp(0.92,1,intro)*(1+0.03*HOT[id]), dx=0, glowK=HOT[id];
    if(GS.phase==='fb'||GS.phase==='done'){
      const fa=t-GS.fbT0;
      if(i===q.ans){ scale*=1+0.06*Math.max(0,Math.sin(fa/120))*Math.exp(-fa/500); glowK=1; }
      if(i===GS.sel && !GS.fbCorrect){ dx=Math.sin(fa/30)*Math.exp(-fa/180)*u(0.012); }
    }
    // colors per state
    let fill='#0e1e2c', fg='#cfd8dc', bd=hexA(z.accent,0.4+0.4*HOT[id]), glow='transparent';
    if(GS.phase==='fb'||GS.phase==='done'){
      if(i===q.ans){ fill='#143a1c'; fg='#A5D6A7'; bd='#69F0AE'; glow='#69F0AE'; }
      else if(i===GS.sel){ fill='#3a0e0e'; fg='#EF9A9A'; bd='#FF8A80'; glow='#FF5252'; }
      else { fill='#0a1520'; fg='#37474F'; bd='transparent'; }
    } else if(HOT[id]>0.02){ fill='#123048'; glow=z.accent; }

    ctx.save();
    ctx.globalAlpha*=intro;
    const cxp=ox+oW/2, cyp=oy+oH/2;
    ctx.translate(cxp+dx,cyp); ctx.scale(scale,scale); ctx.translate(-cxp,-cyp);
    rr(ox,oy,oW,oH,u(0.012));
    if(glow!=='transparent'){ ctx.shadowColor=glow; ctx.shadowBlur=u(0.015)+u(0.025)*glowK; }
    ctx.fillStyle=fill; ctx.fill(); ctx.shadowBlur=0;
    rr(ox,oy,oW,oH,u(0.012)); ctx.strokeStyle=bd; ctx.lineWidth=1.5; ctx.stroke();
    // label badge
    rr(ox+u(0.012),oy+oH/2-u(0.028),u(0.036),u(0.056),5);
    ctx.fillStyle=(GS.phase==='q')?hexA(z.color,0.75):(i===q.ans?'#2E7D32':i===GS.sel?'#7a1414':'#1a1a2a');
    ctx.fill();
    ctx.font=`bold ${u(0.026)}px sans-serif`;
    ctx.fillStyle=(GS.phase==='q')?z.accent:'#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    etext(LBLS[i],ox+u(0.012)+u(0.018),oy+oH/2);
    // option text
    ctx.font=`${u(0.024)}px sans-serif`; ctx.fillStyle=fg;
    ctx.textAlign='left'; ctx.textBaseline='middle';
    const txX=ox+u(0.064), txW=oW-u(0.078);
    const lns=wrap(opt,txW), lH=u(0.030), totalH=lns.length*lH;
    lns.forEach((ln,li)=>etext(ln,txX,oy+oH/2-totalH/2+li*lH+lH/2));
    ctx.restore();

    if(GS.phase==='q' && hit(ox,oy,oW,oH) && !TR.active){
      GS.sel=i; GS.phase='fb'; GS.fbT0=t; GS.fbTimer=2000; GS.fbCorrect=(i===q.ans);
      if(GS.fbCorrect){
        GS.zonePoints+=100; GS.correctInZone++; GS.streak++;
        SFX.correct(GS.streak);
        const ocx=ox+oW/2, ocy=oy+oH/2;
        confettiBurst(ocx,oy,z.accent,28);
        popup(ocx,oy,'+100','#A5D6A7');
        spawnCoins(ocx,ocy, 8+Math.min(GS.streak,6)*2);   // coins fly to score
        shock(ocx,ocy,z.accent,u(0.16)); flash('#CFFFE6',0.16); punch(0.55);
        if(GS.streak>=2) popup(ocx,oy-u(0.055),'🔥 x'+GS.streak,'#FFB300',u(0.034));
      } else {
        GS.streak=0; SFX.wrong(); shake(u(0.012));
        flash('#5c0a0a',0.22); punch(0.5); shock(ox+oW/2,oy+oH/2,'#FF5252',u(0.14));
      }
    }
  });

  // feedback banner (slides up)
  if(GS.phase==='fb'||GS.phase==='done'){
    const fa=t-GS.fbT0, ap=ease.outBack(clamp(fa/300,0,1));
    const fbH=u(0.07), fbY=oY+2*(oH+oMg)+u(0.012);
    ctx.save(); ctx.globalAlpha*=clamp(fa/180,0,1); ctx.translate(0,(1-ap)*u(0.03));
    rr(u(0.035),fbY,W()-u(0.07),fbH,u(0.014));
    ctx.fillStyle=GS.fbCorrect?'rgba(20,58,28,0.96)':'rgba(58,14,14,0.96)';
    ctx.shadowColor=GS.fbCorrect?'#69F0AE':'#FF5252'; ctx.shadowBlur=u(0.025); ctx.fill(); ctx.shadowBlur=0;
    rr(u(0.035),fbY,W()-u(0.07),fbH,u(0.014));
    ctx.strokeStyle=GS.fbCorrect?'#69F0AE':'#FF8A80'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.font=`bold ${u(0.028)}px sans-serif`; ctx.fillStyle='#fff';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const msg=GS.fbCorrect
      ? U.correct + (GS.streak>1 ? tpl(U.streakSuffix,{n:GS.streak}) : '')
      : tpl(U.answerWas,{a:q.opts[q.ans]});
    etext(msg,W()/2,fbY+fbH/2);
    ctx.restore();
  }
}

// ── ZONE RESULT ───────────────────────────────────────────────
function drawZResult(t){
  const z=ZONES[GS.zIdx], age=t-GS.screenT0;
  bg(t,'#0a1622','#05090f',[z.color,z.accent]);
  drawGrid(t,z.accent); drawParticles(t);

  const pct=Math.round((GS.lastZoneCorrect/z.questions.length)*100);
  // cinematic entrance: shockwave + camera punch + flash, fired once
  if(!GS._zr){ GS._zr=true;
    shock(W()/2,H()*0.32,z.accent,u(0.34)); punch(0.7); flash(z.accent,0.16);
    if(pct>=70)  confettiBurst(W()/2,H()*0.32,z.accent,46);
    if(pct===100) confettiBurst(W()/2,H()*0.30,'#FFD54F',64);
  }
  if(pct>=70) drawRays(t,W()/2,H()*0.42,pct===100?'#FFD54F':z.accent,12,H()*0.55);

  const barH=u(0.13);
  const g=ctx.createLinearGradient(0,0,W(),0);
  g.addColorStop(0,z.color); g.addColorStop(1,hexA(z.color,0.2));
  ctx.fillStyle=g; ctx.fillRect(0,0,W(),barH);
  // "<ZONE> CLEARED" slam-in title (fighting-game flourish)
  ctx.save(); ctx.globalAlpha*=fadeIn(age,0,300);
  const hs=lerp(1.7,1,ease.outBack(clamp(age/340,0,1)));
  ctx.translate(W()/2,barH/2); ctx.scale(hs,hs);
  ctx.font=`900 ${u(0.05)}px sans-serif`; ctx.fillStyle='#fff';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor=z.accent; ctx.shadowBlur=u(0.03);
  etext(z.name.toUpperCase()+'  '+U.cleared,0,0);
  ctx.restore();

  const cX=u(0.07), cY=H()*0.19, cW=W()-u(0.14), cH=H()*0.46;
  ctx.save(); ctx.globalAlpha*=fadeIn(age,120,450);
  glassCard(cX,cY,cW,cH,u(0.02),{border:hexA(z.accent,0.5),shadow:hexA(z.accent,0.4)});

  // star rating (pop in)
  const litCount=pct>=70?3:pct>=40?2:1, sStep=u(0.07), sy=cY+cH*0.17, sx0=W()/2-sStep;
  for(let i=0;i<3;i++){
    const pop=ease.outBack(clamp((age-300-i*160)/360,0,1));
    if(pop<=0) continue;
    ctx.save(); ctx.translate(sx0+i*sStep,sy); ctx.scale(pop,pop);
    ctx.font=`${u(0.05)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.globalAlpha*=(i<litCount)?1:0.25;
    etext(i<litCount?'⭐':'☆',0,0);
    ctx.restore();
  }
  // counting score
  const shown=Math.round(GS.lastZonePoints*ease.outCubic(clamp((age-200)/1000,0,1)));
  ctx.font=`900 ${u(0.1)}px sans-serif`; ctx.fillStyle=z.accent;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor=z.accent; ctx.shadowBlur=u(0.03);
  etext(`+${shown}`,W()/2,cY+cH*0.46); ctx.shadowBlur=0;
  ctx.font=`${u(0.03)}px sans-serif`; ctx.fillStyle='#CFD8DC';
  etext(U.pointsEarned,W()/2,cY+cH*0.61);
  ctx.font=`bold ${u(0.034)}px sans-serif`;
  ctx.fillStyle=pct>=70?'#69F0AE':pct>=40?'#FFB300':'#FF8A80';
  etext(tpl(U.correctOf,{c:GS.lastZoneCorrect,n:z.questions.length,p:pct}),W()/2,cY+cH*0.75);
  const msg=pct===100?U.msgPerfect:pct>=70?U.msgGreat:pct>=40?U.msgOk:U.msgLow;
  ctx.font=`${u(0.032)}px sans-serif`; ctx.fillStyle='#E0F7FA';
  etext(msg,W()/2,cY+cH*0.88);
  ctx.restore();

  ctx.save(); ctx.globalAlpha*=fadeIn(age,400,400);
  ctx.font=`${u(0.03)}px sans-serif`; ctx.fillStyle='#FFB300';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  etext(`${U.total}  ⭐ ${GS.totalScore} / ${MAX_SCORE}`,W()/2,H()*0.71);
  ctx.restore();

  const allDone=GS.done.size===5;
  const bW=u(0.52),bH=u(0.092),bX=(W()-bW)/2,bY=H()*0.8;
  ctx.save(); ctx.globalAlpha*=fadeIn(age,500,400);
  const clicked=drawButton('zback',bX,bY,bW,bH,
    allDone?U.seeFinal:U.backMap,
    {grad:[z.color,z.accent],glow:z.accent,color:'#04121b'});
  ctx.restore();
  if(clicked){
    if(allDone) goto('gameover',{color:'#FFB300',cb:()=>{ GS.celebrate=true; SFX.victory(); }});
    else        goto('map',{color:'#00ACC1'});
  }
}

// ── GAMEOVER SCREEN ───────────────────────────────────────────
function drawGameover(t){
  const age=t-GS.screenT0;
  bg(t,'#0a1018','#03060a',['#FFB300','#00ACC1']);
  drawGrid(t,'#FFB300'); drawCodeRain(t,'#00E5FF',0.08); drawParticles(t);

  const pct=Math.round((GS.totalScore/MAX_SCORE)*100);
  ctx.save(); ctx.globalAlpha=0.55;
  drawTower(W()/2, H()*0.0, H()*0.66, H()*0.1, t, '#00E5FF', true);  // activated tower
  ctx.restore();
  drawRays(t,W()/2,H()*0.13,'#FFD54F',14,H()*0.62);     // victory god rays
  const by=Math.abs(Math.sin(t/500))*u(0.012);
  ctx.save(); ctx.globalAlpha*=fadeIn(age,0,500);
  ctx.font=`${u(0.1)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  etext('🏆',W()/2,H()*0.12-by);
  ctx.restore();

  ctx.save(); ctx.globalAlpha*=fadeIn(age,150,500);
  ctx.font=`900 ${u(0.06)}px sans-serif`; ctx.fillStyle='#FFB300';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor='#FFB300'; ctx.shadowBlur=u(0.03)+u(0.01)*Math.sin(t/400);
  try{ctx.letterSpacing=u(0.004)+'px';}catch(e){}
  etext(U.complete,W()/2,H()*0.225);
  try{ctx.letterSpacing='0px';}catch(e){} ctx.shadowBlur=0;
  ctx.restore();

  const shown=Math.round(GS.totalScore*ease.outCubic(clamp((age-300)/1200,0,1)));
  ctx.save(); ctx.globalAlpha*=fadeIn(age,300,500);
  ctx.font=`${u(0.038)}px sans-serif`; ctx.fillStyle='#80DEEA';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  etext(tpl(U.finalScore,{s:shown,m:MAX_SCORE,p:Math.round(shown/MAX_SCORE*100)}),W()/2,H()*0.31);
  const rank=pct===100?U.rankLegend:pct>=80?U.rankAnalyst:pct>=60?U.rankAssociate:U.rankObserver;
  ctx.font=`bold ${u(0.042)}px sans-serif`; ctx.fillStyle='#E0F7FA';
  etext(rank,W()/2,H()*0.385);
  ctx.restore();

  // zone table (staggered)
  const tX=u(0.06), tY=H()*0.46, rH=u(0.055), cW=(W()-3*u(0.02)-tX*2)/2;
  ZONES.forEach((z,i)=>{
    let rx,ry; const rowI=Math.floor(i/2), colI=i%2;
    if(i===4){ rx=(W()-cW)/2; ry=tY+rowI*(rH+u(0.012)); }
    else     { rx=tX+colI*(cW+u(0.02)); ry=tY+rowI*(rH+u(0.012)); }
    ctx.save(); ctx.globalAlpha*=fadeIn(age,500+i*120,400);
    rr(rx,ry,cW,rH,u(0.01)); ctx.fillStyle=hexA(z.color,0.55); ctx.fill();
    rr(rx,ry,cW,rH,u(0.01)); ctx.strokeStyle=hexA(z.accent,0.4); ctx.lineWidth=1; ctx.stroke();
    ctx.font=`${u(0.024)}px sans-serif`; ctx.fillStyle='#fff';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    etext(z.emoji+' '+z.name,rx+u(0.015),ry+rH/2);
    ctx.fillStyle=z.accent; ctx.textAlign='right';
    etext(`${GS.zoneScore[z.id]||0} pts`,rx+cW-u(0.015),ry+rH/2);
    ctx.restore();
  });

  const bW=u(0.48),bH=u(0.092),bX=(W()-bW)/2,bY=H()*0.88;
  ctx.save(); ctx.globalAlpha*=fadeIn(age,900,400);
  const clicked=drawButton('again',bX,bY,bW,bH,U.playAgain,
    {grad:['#00E5FF','#FFB300'],glow:'#00E5FF',color:'#04121b'});
  ctx.restore();
  if(clicked){ resetGame(); goto('intro',{color:'#00ACC1'}); }
}

// ── Quiz timer / phase advance (with sound cues) ─────────────
function updateTimers(ts,dt){
  if(GS.screen!=='quiz') return;
  const z=ZONES[GS.zIdx];
  if(GS.phase==='q'){
    GS.timer-=dt;
    if(GS.timer<=5200){
      const s=Math.ceil(GS.timer/1000);
      if(s!==GS.lastTickSec && s>0){ GS.lastTickSec=s; SFX.tick(); }
    }
    if(GS.timer<=0){
      GS.timer=0; GS.sel=-1; GS.phase='fb'; GS.fbCorrect=false; GS.fbTimer=2200; GS.fbT0=ts;
      GS.streak=0; SFX.wrong(); shake(u(0.012));
      flash('#5c0a0a',0.22); punch(0.5); shock(W()/2,H()*0.5,'#FF5252',u(0.16));
    }
  } else if(GS.phase==='fb'){
    GS.fbTimer-=dt;
    if(GS.fbTimer<=0){
      GS.qIdx++;
      if(GS.qIdx>=z.questions.length){
        const prev=GS.zoneScore[z.id]||0;
        GS.totalScore=GS.totalScore-prev+GS.zonePoints;
        GS.zoneScore[z.id]=GS.zonePoints;
        GS.lastZonePoints=GS.zonePoints;
        GS.lastZoneCorrect=GS.correctInZone;
        GS.done.add(z.id);
        GS.phase='done'; GS._zr=false;
        SFX.zoneComplete();
        confettiBurst(W()/2,H()*0.28,'#FFB300',40);
        punch(0.85); flash('#FFFFFF',0.22);
        goto('zresult',{color:z.color});
      } else {
        GS.phase='q'; GS.timer=15000; GS.sel=-1; GS.qAnimT0=ts; GS.lastTickSec=99;
      }
    }
  }
}

// ── GAME LOOP ─────────────────────────────────────────────────
let lastTs=0;
function loop(ts){
  const dt=Math.min(ts-lastTs||16,100); lastTs=ts; dtGlobal=dt; TNOW=ts;
  U = (I18N[LANG]||I18N.en).ui;          // active language bundle for this frame
  if(GS.screenT0===0) GS.screenT0=ts;

  // updates
  updateTransition(ts,dt);
  updateTimers(ts,dt);
  SHAKE.mag*=Math.exp(-dt/90);
  FLASH.a*=Math.exp(-dt/90); PUNCH*=Math.exp(-dt/70); scorePulse*=Math.exp(-dt/180);
  SFX.updateAmbient();
  if(GS.celebrate && GS.screen==='gameover'){
    GS._ct+=dt; if(GS._ct>90){ GS._ct=0; confettiRain(5); }
  }

  // mute toggle gets first crack at the click
  wantPointer=false;
  if(CLICK && inMute(CLICK.x,CLICK.y)){ SFX.ensure(); SFX.setMuted(!SFX.muted); SFX.click(); CLICK=null; }

  // render (with screen shake)
  ctx.clearRect(0,0,W(),H());
  ctx.save();
  const sx=(Math.random()*2-1)*SHAKE.mag, sy=(Math.random()*2-1)*SHAKE.mag;
  ctx.translate(sx,sy);
  if(PUNCH>0.001){ const px=W()/2,py=H()/2,ps=1+0.03*PUNCH;   // camera punch
                   ctx.translate(px,py); ctx.scale(ps,ps); ctx.translate(-px,-py); }
  try {
    switch(GS.screen){
      case 'intro':    drawIntro(ts);    break;
      case 'map':      drawMap(ts);      break;
      case 'fact':     drawFact(ts);     break;
      case 'quiz':     drawQuiz(ts);     break;
      case 'zresult':  drawZResult(ts);  break;
      case 'gameover': drawGameover(ts); break;
    }
    drawShocks(dt); drawConfetti(dt); drawCoins(dt); drawEmbers(dt); drawPopups(dt); drawRipples(dt);
  } catch(err){
    // never let one bad frame kill the rAF loop — log once, keep running
    if(!loop._warned){ console.error('render error:',err); loop._warned=true; }
  }
  ctx.restore();

  // stable overlays (unshaken)
  vignette();
  if(!TR.active) drawScanIn(ts-GS.screenT0);   // Lyoko scanner materialization
  drawFlash();
  drawMute();
  drawTransition();

  C.style.cursor = wantPointer?'pointer':'default';
  CLICK=null;                       // consume click
  requestAnimationFrame(loop);
}

// ── Language dropdown (top-right) ─────────────────────────────
(function initLang(){
  if(typeof document==='undefined' || typeof document.createElement!=='function') return;
  const sel=document.getElementById('lang');
  if(!sel || !sel.appendChild) return;
  LANGS.forEach(l=>{ const o=document.createElement('option'); o.value=l.code; o.textContent=l.label; sel.appendChild(o); });
  sel.value=LANG;
  sel.addEventListener('change',()=>{
    LANG=sel.value;
    try{ localStorage.setItem('amundi_lang',LANG); }catch(e){}
    buildZones();                   // rebuild zone content in the new language
    SFX.ensure(); SFX.startAmbient();
  });
})();

requestAnimationFrame(loop);
</script>
