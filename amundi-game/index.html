// CANVAS
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const DPR_CAP = 1.5;
let W, H;
let starField = null;

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, DPR_CAP);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  starField = null;
}
addEventListener('resize', resize);
addEventListener('orientationchange', resize);
resize();

// ═══════════════════════════════════════════════════════════════
// CAMERA
// ═══════════════════════════════════════════════════════════════
const cam = { x: WW / 2, y: WH * 0.38, z: 0.001, tx: WW / 2, ty: WH * 0.38, tz: 0.001 };

function fitZoom() { return Math.min(W / WW, H / WH) * 0.9; }

function w2s(wx, wy) { return { x: (wx - cam.x) * cam.z + W / 2, y: (wy - cam.y) * cam.z + H / 2 }; }
function s2w(sx, sy) { return { x: (sx - W / 2) / cam.z + cam.x, y: (sy - H / 2) / cam.z + cam.y }; }

function flyTo(wx, wy, zoom, cb) {
  cam.tx = wx; cam.ty = wy; cam.tz = zoom;
  _flyCallback = cb;
  _flyCallbackFired = false;
}
let _flyCallback = null, _flyCallbackFired = false;

// ═══════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════

  sparks: [],

}

// ═══════════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════════
let drag = null, pinchStart = null;
const clicked = { x: null, y: null };
const keys = new Set();

addEventListener('keydown', e => {
  if (e.code === 'Escape') handleEsc();
  if (e.code === 'Space' || e.code === 'Enter') { keys.add('confirm'); e.preventDefault(); }
  if (['Digit1','Digit2','Digit3','Digit4'].includes(e.code)) selectAnswer(+e.code.slice(-1) - 1);
});

addEventListener('wheel', e => {
  if (st.screen !== 'map') return;
  const factor = e.deltaY < 0 ? 1.13 : 0.88;
  const wc = s2w(e.clientX, e.clientY);
  cam.tz = Math.max(0.05, Math.min(8, cam.tz * factor));
  cam.tx = wc.x + (cam.tx - wc.x) / factor;
  cam.ty = wc.y + (cam.ty - wc.y) / factor;
  e.preventDefault();
}, { passive: false });

addEventListener('mousedown', e => {
  drag = { sx: e.clientX, sy: e.clientY, cx: cam.tx, cy: cam.ty };
  canvas.classList.add('grabbing');
});
addEventListener('mousemove', e => {
  if (drag) {
    cam.tx = drag.cx - (e.clientX - drag.sx) / cam.tz;
    cam.ty = drag.cy - (e.clientY - drag.sy) / cam.tz;
  }
  if (st.screen === 'map') {
    st.hovered = null;
    for (const ms of MS) {
      const sp = w2s(ms.x, ms.y);
      if (Math.hypot(e.clientX - sp.x, e.clientY - sp.y) < nodeR(ms) + 14) { st.hovered = ms; break; }
    }
    canvas.classList.toggle('grab', !drag && !!st.hovered);
  }
});
addEventListener('mouseup', e => {
  if (drag && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 8) {
    clicked.x = e.clientX; clicked.y = e.clientY;
  }
  drag = null;
  canvas.classList.remove('grabbing');
  canvas.classList.remove('grab');
});

addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    drag = { sx: t.clientX, sy: t.clientY, cx: cam.tx, cy: cam.ty };
  } else if (e.touches.length === 2) {
    pinchStart = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
    drag = null;
  }
  if (st.screen === 'title' || st.screen === 'complete') keys.add('confirm');
  e.preventDefault();
}, { passive: false });

addEventListener('touchmove', e => {
  if (e.touches.length === 1 && drag) {
    cam.tx = drag.cx - (e.touches[0].clientX - drag.sx) / cam.tz;
    cam.ty = drag.cy - (e.touches[0].clientY - drag.sy) / cam.tz;
  } else if (e.touches.length === 2 && pinchStart) {
    const d = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
    cam.tz = Math.max(0.05, Math.min(8, cam.tz * d / pinchStart));
    pinchStart = d;
  }
  e.preventDefault();
}, { passive: false });

addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  if (drag && Math.hypot(t.clientX - drag.sx, t.clientY - drag.sy) < 15) {
    clicked.x = t.clientX; clicked.y = t.clientY;
  }
  drag = null; pinchStart = null;
});

// ═══════════════════════════════════════════════════════════════
// LOGIC
// ═══════════════════════════════════════════════════════════════
function nodeR(ms) { return ms.isSpecial ? 26 : 19; }

function handleEsc() {
  if (st.screen === 'quiz') { st.screen = 'dive'; }
  else if (st.screen === 'dive') surfaceUp();
}

function dive(ms) {
  st.active = ms;
  st.diveAlpha = 0;
  visited.add(ms.id);
  // Dramatic zoom-in: fly to ms, then open card
  flyTo(ms.x, ms.y, 5.5, () => { st.screen = 'dive'; });
  st.screen = 'flyto';
  spawnStreaks();
}

function surfaceUp() {
  st.screen = 'map';
  cam.tz = Math.max(0.25, fitZoom());
  cam.tx = WW / 2; cam.ty = WH * 0.38;
  st.active = null;
}

function spawnStreaks() {
  for (let i = 0; i < 60; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = 80 + Math.random() * (Math.max(W, H) * 0.6);
    st.streaks.push({
      x: W / 2 + Math.cos(a) * d, y: H / 2 + Math.sin(a) * d,
      vx: -Math.cos(a) * (5 + Math.random() * 12),
      vy: -Math.sin(a) * (5 + Math.random() * 12),
      len: 15 + Math.random() * 50,
      color: Math.random() < 0.6 ? '#00B38A' : '#FFD700',
      life: 1.0,
    });
  }
}

function spawnSparks(x, y) {
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 7;
    st.sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, life: 1, color: '#FFD700', s: 3 + Math.random() * 5 });
  }
  for (let i = 0; i < 20; i++) {
    const a = Math.random() * Math.PI * 2;
    st.sparks.push({ x, y, vx: Math.cos(a) * (1 + Math.random() * 4), vy: Math.sin(a) * (1 + Math.random() * 4), life: 1, color: '#00B38A', s: 2 + Math.random() * 4 });
  }
}

function openQuiz() {
  if (!st.active?.quiz || quizDone.has(st.active.id)) return;
  st.screen = 'quiz';
  st.quizResult = null;
  st.quizSelected = null;
}

function selectAnswer(i) {
  if (st.screen !== 'quiz' || st.quizResult !== null) return;
  st.quizSelected = i;
  st.quizResult = i === st.active.quiz.correct ? 'correct' : 'wrong';
  if (st.quizResult === 'correct') {
    quizDone.add(st.active.id);
    spawnSparks(W / 2, H * 0.55);
  }
}

function handleClick(cx, cy) {
  if (st.screen === 'map') {
    for (const ms of MS) {
      const sp = w2s(ms.x, ms.y);
      if (Math.hypot(cx - sp.x, cy - sp.y) < nodeR(ms) + 18) { dive(ms); return; }
    }
  }
  if (st.screen === 'dive') {
    // Quiz button
    const bw = Math.min(W * 0.82, 660), bx = (W - bw) / 2;
    const qBtnY = H - 140;
    if (cy >= qBtnY && cy <= qBtnY + 50 && cx >= bx + 16 && cx <= bx + bw - 16) { openQuiz(); return; }
    // Surface button
    if (cy >= H - 76 && cy <= H - 30 && cx >= bx + 16 && cx <= bx + bw - 16) { surfaceUp(); return; }
  }
  if (st.screen === 'quiz' && st.quizResult !== null) {
    st.screen = 'dive';
    checkComplete();
    return;
  }
  if (st.screen === 'quiz') {
    // Answer buttons
    const bw = Math.min(W * 0.88, 640), bx = (W - bw) / 2;
    const btnH = 58, btnGap = 10, btn0 = H * 0.3;
    for (let i = 0; i < 4; i++) {
      const by = btn0 + i * (btnH + btnGap);
      if (cy >= by && cy <= by + btnH && cx >= bx + 10 && cx <= bx + bw - 10) { selectAnswer(i); return; }
    }
  }
}

function checkComplete() {
  if (visited.size >= MS.length) setTimeout(() => { st.screen = 'complete'; }, 800);
}

// ═══════════════════════════════════════════════════════════════
// UPDATE
// ═══════════════════════════════════════════════════════════════
function update() {
  // Camera lerp
  cam.x += (cam.tx - cam.x) * 0.1;
  cam.y += (cam.ty - cam.y) * 0.1;
  cam.z += (cam.tz - cam.z) * 0.1;
  cam.x = Math.max(-300, Math.min(WW + 300, cam.x));
  cam.y = Math.max(-200, Math.min(WH + 200, cam.y));

  // Flyto → dive
  if (st.screen === 'flyto' && _flyCallback && !_flyCallbackFired) {
    const dz = Math.abs(cam.z - cam.tz), dp = Math.hypot(cam.x - cam.tx, cam.y - cam.ty);
    if (dz < 0.08 && dp < 6) { _flyCallbackFired = true; _flyCallback(); }
  }

  // Dive fade-in
  if (st.screen === 'dive' || st.screen === 'quiz') st.diveAlpha = Math.min(1, st.diveAlpha + 0.04);

  // Title anim
  if (st.screen === 'title') st.titleT += 0.016;

  // Intro zoom
  if (st.screen === 'intro') {
    const fz = fitZoom();
    cam.tz = fz; cam.tx = WW / 2; cam.ty = WH * 0.38;
    if (Math.abs(cam.z - fz) < 0.003) { st.screen = 'map'; }
  }

  // Particles
  for (let i = st.sparks.length - 1; i >= 0; i--) {
    const p = st.sparks[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.024;
    if (p.life <= 0) st.sparks.splice(i, 1);
  }
  for (let i = st.streaks.length - 1; i >= 0; i--) {
    const s = st.streaks[i];
    s.x += s.vx; s.y += s.vy; s.life -= 0.04;
    if (s.life <= 0) st.streaks.splice(i, 1);
  }

  // Clicks
  if (clicked.x !== null) {
    handleClick(clicked.x, clicked.y);
    clicked.x = clicked.y = null;
  }

  // Keys
  if (keys.has('confirm')) {
    if (st.screen === 'title') startIntro();
    else if (st.screen === 'complete') { visited.clear(); quizDone.clear(); st.screen = 'title'; cam.tz = 0.001; cam.z = 0.001; }
    else if (st.screen === 'quiz' && st.quizResult !== null) { st.screen = 'dive'; checkComplete(); }
    else if (st.screen === 'dive') openQuiz();
    keys.delete('confirm');
  }
  keys.clear();
}

function startIntro() {
  cam.z = 0.001; cam.tz = 0.001;
  cam.x = WW / 2; cam.y = WH * 0.38;
  cam.tx = WW / 2; cam.ty = WH * 0.38;
  st.screen = 'intro';
  _flyCallback = null; _flyCallbackFired = false;
}

// ═══════════════════════════════════════════════════════════════
// DRAWING HELPERS
// ═══════════════════════════════════════════════════════════════
function rr(x, y, w, h, r, fill, stroke, lw = 1.5) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill)  { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

function txt(t, x, y, sz, color, align = 'left', bold = false, italic = false) {
  ctx.fillStyle = color;
  ctx.font = `${italic?'italic ':''}${bold?'bold ':''}${sz}px 'Segoe UI',Arial,sans-serif`;
  ctx.textAlign = align; ctx.fillText(t, x, y);
}

function wrap(text, x, y, maxW, sz, color, align = 'center', lead = 1.45) {
  ctx.fillStyle = color;
  ctx.font = `${sz}px 'Segoe UI',Arial,sans-serif`;
  ctx.textAlign = align;
  const words = text.split(' ');
  let line = '', ly = y;
  for (const w of words) {
    const test = line + (line ? ' ' : '') + w;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, ly); line = w; ly += sz * lead; }
    else line = test;
  }
  ctx.fillText(line, x, ly);
  return ly + sz;
}

// ═══════════════════════════════════════════════════════════════
// SPACE BACKGROUND
// ═══════════════════════════════════════════════════════════════
function drawSpace(pxOff = 0, pyOff = 0) {
  const bg = ctx.createRadialGradient(W/2, H*0.4, 0, W/2, H*0.4, Math.max(W,H)*0.9);
  bg.addColorStop(0, '#060D1C'); bg.addColorStop(0.6, '#030810'); bg.addColorStop(1, '#010408');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Nebula wisps
  for (const [nx, ny, nr, nc] of [[W*0.28,H*0.3,W*0.45,'rgba(0,40,80,0.10)'],[W*0.72,H*0.65,W*0.38,'rgba(0,30,60,0.08)']]) {
    const n = ctx.createRadialGradient(nx,ny,0,nx,ny,nr);
    n.addColorStop(0,nc); n.addColorStop(1,'transparent');
    ctx.fillStyle=n; ctx.fillRect(0,0,W,H);
  }

  if (!starField) buildStars();
  const speeds = [0.04, 0.12, 0.28];
  const now = Date.now();
  for (let li = 0; li < 3; li++) {
    for (const s of starField[li]) {
      const sx = (s.x * W + pxOff * speeds[li] * 0.001 + W * 10) % W;
      const sy = (s.y * H + pyOff * speeds[li] * 0.001 + H * 10) % H;
      const tw = 0.7 + 0.3 * Math.sin(now / s.tw + s.x * 6.28);
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(sx, sy, s.s, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════════════
// WORLD MAP
// ═══════════════════════════════════════════════════════════════
function drawMap() {
  ctx.save();
  ctx.translate(W/2 - cam.x*cam.z, H/2 - cam.y*cam.z);
  ctx.scale(cam.z, cam.z);

  // Ocean
  const oc = ctx.createLinearGradient(0,0,0,WH);
  oc.addColorStop(0,'#060F20'); oc.addColorStop(1,'#050C18');
  ctx.fillStyle = oc; ctx.fillRect(0,0,WW,WH);

  // Grid lines
  ctx.strokeStyle = 'rgba(0,80,160,0.055)'; ctx.lineWidth = 1/cam.z;
  for (let lat = -60; lat <= 60; lat += 30) {
    const y = ((90-lat)/180)*WH;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(WW,y); ctx.stroke();
  }
  for (let lon = -150; lon <= 150; lon += 30) {
    const x = ((lon+180)/360)*WW;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,WH); ctx.stroke();
  }

  // Continents
  for (const c of CONTS) {
    ctx.beginPath();
    ctx.moveTo(c.pts[0][0]*WW, c.pts[0][1]*WH);
    for (let i=1;i<c.pts.length;i++) ctx.lineTo(c.pts[i][0]*WW, c.pts[i][1]*WH);
    ctx.closePath();
    ctx.fillStyle = c.d; ctx.fill();
    ctx.strokeStyle = 'rgba(20,70,140,0.28)'; ctx.lineWidth = 1.5/cam.z; ctx.stroke();
  }

  // Journey path
  const sorted = [...MS].sort((a,b)=>a.year-b.year);
  ctx.setLineDash([7/cam.z, 5/cam.z]);
  for (let i=0; i<sorted.length-1; i++) {
    const a=sorted[i], b=sorted[i+1];
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2 - Math.min(200, Math.hypot(a.x-b.x,a.y-b.y)*0.4);
    const vg = (visited.has(a.id) && visited.has(b.id)) ? 0.55 : 0.14;
    ctx.strokeStyle = `rgba(0,179,138,${vg})`;
    ctx.lineWidth = 2/cam.z;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo(mx,my,b.x,b.y); ctx.stroke();
  }
  ctx.setLineDash([]);

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
// NODES
// ═══════════════════════════════════════════════════════════════
function drawNodes() {
  ctx.save();
  ctx.translate(W/2 - cam.x*cam.z, H/2 - cam.y*cam.z);
  ctx.scale(cam.z, cam.z);

  for (const ms of MS) drawNode(ms);

  ctx.restore();
}

function drawNode(ms) {
  const { x, y } = ms;
  const t = Date.now() / 1000;
  const hov = st.hovered?.id === ms.id;
  const vis = visited.has(ms.id);
  const r = nodeR(ms) + (hov ? 5 : 0);
  const pulse = r + 10 + Math.sin(t * 2.2 + x * 0.005) * 5;

  // Aura glow
  const aura = ctx.createRadialGradient(x,y,0,x,y,r*3.5);
  aura.addColorStop(0, ms.color + (vis ? '44' : '22'));
  aura.addColorStop(1, 'transparent');
  ctx.fillStyle = aura; ctx.beginPath(); ctx.arc(x,y,r*3.5,0,Math.PI*2); ctx.fill();

  // Pulse ring (unvisited)
  if (!vis) {
    const pa = (0.25 + 0.2*Math.sin(t*2.8 + x*0.01));
    ctx.strokeStyle = ms.color; ctx.lineWidth = 1.8/cam.z;
    ctx.globalAlpha = pa;
    ctx.beginPath(); ctx.arc(x, y, pulse, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Extra rings (special)
  if (ms.isSpecial) {
    for (let ri=1; ri<=2; ri++) {
      ctx.strokeStyle = ms.color; ctx.lineWidth = (1.2-ri*0.4)/cam.z;
      ctx.globalAlpha = 0.12 / ri;
      ctx.beginPath(); ctx.arc(x, y, r + ri*22, 0, Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // Node body
  ctx.fillStyle = vis ? ms.color : '#0D1E2E';
  ctx.strokeStyle = ms.color; ctx.lineWidth = (ms.isSpecial?3:2)/cam.z;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();

  // Icon
  const fsz = r * 1.15;
  ctx.font = `${fsz}px serif`; ctx.textAlign = 'center';
  ctx.fillStyle = vis ? '#fff' : ms.color;
  ctx.fillText(ms.icon, x, y + fsz*0.38);

  // Checkmark for visited
  if (vis) {
    ctx.fillStyle = '#fff'; ctx.font = `bold ${r*0.55}px sans-serif`; ctx.textAlign = 'center';
    ctx.fillText('✓', x + r*0.52, y - r*0.5);
  }

  // Label (appears as zoom grows)
  const labelAlpha = Math.max(0, Math.min(1, (cam.z - 0.12) / 0.18));
  if (labelAlpha > 0.01) {
    ctx.globalAlpha = labelAlpha;
    const lsz = Math.max(10, 13/cam.z);
    const ly = y - r - 12/cam.z;
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.font = `bold ${lsz}px 'Segoe UI',Arial`; ctx.textAlign = 'center';
    ctx.fillText(ms.title, x+1, ly+1);
    ctx.fillStyle = hov ? '#fff' : ms.color;
    ctx.fillText(ms.title, x, ly);
    // Year
    const ysz = Math.max(8, 10/cam.z);
    ctx.font = `${ysz}px 'Segoe UI',Arial`; ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText(ms.year, x, ly - lsz*1.2);
    ctx.globalAlpha = 1;
  }
}

// ═══════════════════════════════════════════════════════════════
// ATMOSPHERE EFFECT
// ═══════════════════════════════════════════════════════════════
function drawAtmosphere() {
  const f = Math.max(0, Math.min(1, (cam.z - 0.08) / 0.6));
  if (f < 0.01) return;
  const a = ctx.createRadialGradient(W/2,H/2,W*0.28,W/2,H/2,W*0.75);
  a.addColorStop(0,'transparent'); a.addColorStop(1,`rgba(0,20,60,${f*0.22})`);
  ctx.fillStyle=a; ctx.fillRect(0,0,W,H);
}

// ═══════════════════════════════════════════════════════════════
// VIGNETTE
// ═══════════════════════════════════════════════════════════════
function drawVignette() {
  const v = ctx.createRadialGradient(W/2,H/2,W*0.28,W/2,H/2,W*0.78);
  v.addColorStop(0,'transparent'); v.addColorStop(1,'rgba(0,0,0,0.5)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
}

// ═══════════════════════════════════════════════════════════════
// WARP STREAKS
// ═══════════════════════════════════════════════════════════════
function drawStreaks() {
  for (const s of st.streaks) {
    ctx.globalAlpha = s.life * 0.7;
    ctx.strokeStyle = s.color; ctx.lineWidth = 1.5;
    const nx = s.vx / Math.hypot(s.vx, s.vy);
    const ny = s.vy / Math.hypot(s.vx, s.vy);
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + nx*s.len, s.y + ny*s.len); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════════════
// SPARKS
// ═══════════════════════════════════════════════════════════════
function drawSparks() {
  for (const p of st.sparks) {
    ctx.globalAlpha = p.life * 0.85;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════════════
// DIVE CARD
// ═══════════════════════════════════════════════════════════════
function drawDive() {
  const ms = st.active; if (!ms) return;
  const a = st.diveAlpha; if (a < 0.01) return;

  // Dimensional overlay
  ctx.fillStyle = `rgba(2,5,12,${0.88*a})`; ctx.fillRect(0,0,W,H);

  // Card glow
  const cg = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.55);
  cg.addColorStop(0, ms.color + Math.floor(0x28*a).toString(16).padStart(2,'0'));
  cg.addColorStop(1,'transparent');
  ctx.globalAlpha = a; ctx.fillStyle=cg; ctx.fillRect(0,0,W,H);

  ctx.globalAlpha = a;
  const cw = Math.min(W*0.88, 680), cx2 = (W-cw)/2, cy2 = 54, ch = H-70;

  // Card background
  rr(cx2, cy2, cw, ch, 20, '#07101E', ms.color, 2);

  // Header gradient
  const hg = ctx.createLinearGradient(cx2, cy2, cx2+cw, cy2);
  hg.addColorStop(0, ms.color+'28'); hg.addColorStop(1, 'transparent');
  rr(cx2, cy2, cw, 60, [20,20,0,0], null);
  ctx.fillStyle=hg; ctx.fill();
  ctx.strokeStyle=ms.color+'33'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(cx2,cy2+60); ctx.lineTo(cx2+cw,cy2+60); ctx.stroke();

  // Era + location
  txt(ms.era.toUpperCase(), cx2+18, cy2+22, 11, ms.color, 'left', true);
  txt('📍 '+ms.loc, cx2+cw-16, cy2+22, 12, '#999', 'right');

  // Year watermark
  ctx.fillStyle = ms.color+'22';
  ctx.font = 'bold 80px "Segoe UI",Arial'; ctx.textAlign='right';
  ctx.fillText(ms.year, cx2+cw-14, cy2+68);

  // Icon + title
  ctx.font = '42px serif'; ctx.textAlign='left'; ctx.fillStyle='#fff';
  ctx.fillText(ms.icon, cx2+18, cy2+64);
  txt(ms.title, cx2+72, cy2+57, 22, '#fff', 'left', true);

  // Body
  ctx.fillStyle = '#8AAAC0';
  const bodyEndY = wrap(ms.body, cx2+18, cy2+82, cw-36, 13, '#8AAAC0', 'left', 1.55);

  // Facts
  const factsY = bodyEndY + 12;
  txt('KEY FACTS', cx2+18, factsY, 11, '#2A6A8A', 'left', true);
  ctx.strokeStyle='#2A6A8A44'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(cx2+88, factsY-5); ctx.lineTo(cx2+cw-18, factsY-5); ctx.stroke();

  let fy = factsY+16;
  const maxFacts = ms.isSpecial ? 7 : 5;
  for (const f of ms.facts.slice(0, maxFacts)) {
    rr(cx2+14, fy-15, cw-28, 26, 5, ms.color+'14', null);
    txt('▸', cx2+24, fy+1, 11, ms.color, 'left');
    txt(f, cx2+38, fy+1, 12, '#AAC4D4', 'left');
    fy += 30;
  }

  // Special M&P callout
  if (ms.isSpecial) {
    rr(cx2+14, fy+2, cw-28, 36, 8, '#E74C3C14', '#E74C3C44', 1);
    txt('★  Heart of Amundi product innovation  ★', W/2, fy+25, 13, '#E74C3C', 'center', true);
    fy += 44;
  }

  // Quiz button
  const hasQuiz = ms.quiz && !quizDone.has(ms.id);
  const qBtnY = H - 140;
  if (hasQuiz) {
    const p2 = 0.8 + 0.2*Math.sin(Date.now()/380);
    ctx.globalAlpha = a * p2;
    rr(cx2+16, qBtnY, cw-32, 50, 14, ms.color, ms.color+'AA', 1.5);
    ctx.globalAlpha = a;
    txt(STR.challenge, W/2, qBtnY+30, 15, '#fff', 'center', true);
  } else if (quizDone.has(ms.id)) {
    rr(cx2+16, qBtnY, cw-32, 50, 14, '#0A3A1A', '#00B38A44', 1);
    txt(STR.done_badge, W/2, qBtnY+30, 15, '#00B38A', 'center', true);
  }

  // Surface button
  rr(cx2+16, H-72, cw-32, 36, 10, 'rgba(255,255,255,0.03)', '#ffffff18', 1);
  txt(STR.surface, W/2, H-49, 13, '#4A7A9A', 'center');

  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════════════
// QUIZ OVERLAY
// ═══════════════════════════════════════════════════════════════
function drawQuiz() {
  const ms = st.active; if (!ms?.quiz) return;
  const q = ms.quiz;

  ctx.fillStyle='rgba(0,0,0,0.82)'; ctx.fillRect(0,0,W,H);

  const qw = Math.min(W*0.88, 640), qx = (W-qw)/2, qy = H*0.05;
  rr(qx, qy, qw, H*0.90, 18, '#070E1C', ms.color, 2);

  // Header
  rr(qx, qy, qw, 54, [18,18,0,0], ms.color+'22', null);
  txt('★ '+ms.era+' Challenge', qx+qw/2, qy+33, 17, ms.color, 'center', true);

  // Question
  const qTextY = qy + 76;
  ctx.fillStyle='#fff';
  const qEndY = wrap(q.q, qx+qw/2, qTextY, qw-44, 17, '#fff', 'center', 1.4);

  // Answers
  const btnH=58, gap=10, btn0 = Math.max(qEndY+18, qy+155);
  const bgC=['#0A1E3A','#0A2A1E','#1E1A00','#1E0A18'];
  const acC=['#2A6AB0','#27AE60','#F39C12','#9B59B6'];
  const letters=['A','B','C','D'];

  q.a.forEach((ans,i) => {
    const by = btn0 + i*(btnH+gap);
    let bg=bgC[i], ac=acC[i];
    if (st.quizResult !== null) {
      if (i===q.correct) { bg='#0A3A1A'; ac='#00B38A'; }
      else if (i===st.quizSelected) { bg='#3A0A0A'; ac='#E74C3C'; }
    }
    rr(qx+10, by, qw-20, btnH, 12, bg, ac, 1.5);
    rr(qx+18, by+13, 32, 32, 8, ac+'33', ac, 1);
    txt(letters[i], qx+34, by+34, 14, ac, 'center', true);
    txt(ans, qx+60, by+34, 14, '#DDD', 'left');
  });

  if (st.quizResult !== null) {
    const ry = btn0 + 4*(btnH+gap)+8;
    const ok = st.quizResult === 'correct';
    rr(qx+10, ry, qw-20, 30, 8, ok?'#0A3A1A':'#3A0A0A', ok?'#00B38A':'#E74C3C', 1.5);
    txt(ok?'✓ Correct!':'✗ Not quite —', qx+qw/2, ry+20, 14, ok?'#00B38A':'#E74C3C', 'center', true);

    const fy2 = ry+36;
    rr(qx+10, fy2, qw-20, 60, 8, 'rgba(0,179,138,0.07)', '#1A5A4A', 1);
    ctx.fillStyle='#88C8B0';
    wrap(q.fact, qx+qw/2, fy2+14, qw-48, 12, '#88C8B0', 'center', 1.5);

    const cby = fy2+68;
    const pp = 0.8+0.2*Math.sin(Date.now()/360);
    ctx.globalAlpha=pp;
    rr(qx+qw/2-105, cby, 210, 44, 12, '#00B38A', '#00E5B0', 2);
    ctx.globalAlpha=1;
    txt(STR.continue, qx+qw/2, cby+28, 15, '#FFF', 'center', true);
  } else {
    txt('Press 1–4 or tap to answer', qx+qw/2, btn0-8, 12, '#2A6A9A', 'center');
  }
  drawSparks();
}

// ═══════════════════════════════════════════════════════════════
// COMPLETE SCREEN
// ═══════════════════════════════════════════════════════════════
function drawComplete() {
  drawSpace();
  drawVignette();

  const cx = W/2, cy = H/2;
  const cg2 = ctx.createRadialGradient(cx,cy,0,cx,cy,320);
  cg2.addColorStop(0,'rgba(0,179,138,0.18)'); cg2.addColorStop(1,'transparent');
  ctx.fillStyle=cg2; ctx.fillRect(0,0,W,H);

  const pw=Math.min(W*0.88,580), px=(W-pw)/2, py=cy-280;
  rr(px,py,pw,560,22,'#07101E','#00B38A',2);

  ctx.font='64px serif'; ctx.textAlign='center'; ctx.fillText('🏆',cx,py+82);
  txt(STR.complete, cx, py+128, 34, '#FFD700', 'center', true);
  txt('You\'ve explored Amundi\'s world', cx, py+162, 17, '#8AAAC0', 'center');

  rr(px+20,py+180,pw-40,64,12,'rgba(0,179,138,0.08)','#00B38A33',1);
  txt('Milestones explored', cx, py+202, 13, '#4A9A8A', 'center');
  txt(`${visited.size} of ${MS.length}`, cx, py+236, 30, '#00B38A', 'center', true);

  const hi = [
    ['⭐','Gilles Cutaya leads Marketing & Products (Jan 2025)','#E74C3C'],
    ['📊','€2,398 billion AUM as of 31 March 2026','#FFD700'],
    ['🌍','200M+ clients across 35+ countries','#00B38A'],
    ['💻','Alto platform: preferred tech partner Europe & Asia','#9B59B6'],
    ['📈','A+ Fitch rating — 9 consecutive years','#3498DB'],
  ];
  let hy = py+262;
  for (const [icon,text,color] of hi) {
    rr(px+20,hy,pw-40,28,6,color+'14',null);
    ctx.font='14px serif'; ctx.textAlign='left'; ctx.fillStyle=color;
    ctx.fillText(icon, px+28, hy+20);
    txt(text, px+50, hy+20, 13, '#AAC4D4', 'left');
    hy+=32;
  }

  const pp2=0.8+0.2*Math.sin(Date.now()/400);
  ctx.globalAlpha=pp2;
  rr(cx-115,py+445,230,48,14,'#00B38A','#00E5B0',2);
  ctx.globalAlpha=1;
  txt(STR.replay, cx, py+475, 16, '#FFF', 'center', true);

  drawSparks();
}

// ═══════════════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════════════
const STEP = 1000/60;
let acc=0, last=performance.now(), paused=false;
let frames=0, fpsAt=last;
addEventListener('blur', ()=>{ paused=true; });
addEventListener('focus',()=>{ paused=false; last=performance.now(); });

const devMode = new URLSearchParams(location.search).has('dev');
if (devMode) document.getElementById('dev').style.display='block';

// Init: start zoomed to space
cam.z=0.001; cam.tz=0.001;

function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { last=now; return; }
  acc+=now-last; last=now;
  while (acc>=STEP) { update(); acc-=STEP; }

  ctx.clearRect(0,0,W,H);

  if (st.screen==='title') {
    drawTitle();
  } else if (st.screen==='complete') {
    drawComplete();
  } else {
    // map/intro/flyto/dive/quiz
    const pxOff = (cam.x - WW/2) * 50;
    const pyOff = (cam.y - WH*0.38) * 50;
    drawSpace(pxOff, pyOff);
    drawAtmosphere();
    drawMap();
    drawNodes();
    drawStreaks();
    drawMapHUD();
    drawVignette();

    if (st.screen==='dive' || st.screen==='flyto') drawDive();
    if (st.screen==='quiz') { drawDive(); drawQuiz(); }
  }

  if (devMode && (frames++, now-fpsAt>=500)) {
    const fps=Math.round(frames*1000/(now-fpsAt)); frames=0; fpsAt=now;
    document.getElementById('dev').textContent=`${fps}fps z=${cam.z.toFixed(2)} sc=${st.screen}`;
  }
}

requestAnimationFrame(frame);
</script>
