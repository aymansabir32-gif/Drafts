// ─── CANVAS SETUP ────────────────────────────────────────────────────────────
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const DPR_CAP = 1.5;
let W, H;

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, DPR_CAP);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize);
addEventListener("orientationchange", resize);
resize();

// ─── INPUT ───────────────────────────────────────────────────────────────────
const BIND = {
  KeyW: "up", KeyS: "down", KeyA: "left", KeyD: "right",
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  KeyE: "interact", Space: "interact", Enter: "confirm",
};
const held = new Set();
const justPressed = new Set();
addEventListener("keydown", e => {
  const c = BIND[e.code];
  if (c) { if (!held.has(c)) justPressed.add(c); held.add(c); e.preventDefault(); }
  if (e.code === "Digit1") selectAnswer(0);
  if (e.code === "Digit2") selectAnswer(1);
  if (e.code === "Digit3") selectAnswer(2);
  if (e.code === "Digit4") selectAnswer(3);
  if (e.code === "Escape") { if (state.screen === "quiz") closeQuiz(); }
});
addEventListener("keyup", e => { const c = BIND[e.code]; if (c) held.delete(c); });

let touchOrigin = null;
addEventListener("touchstart", e => {
  touchOrigin = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if (state.screen === "title") { startGame(); return; }
  if (state.screen === "complete") { resetGame(); return; }
  if (state.screen === "quiz") {
    if (state.quizResult !== null) { closeQuiz(); return; }
    handleQuizTouch(e.touches[0].clientX, e.touches[0].clientY);
  }
  e.preventDefault();
}, { passive: false });

addEventListener("touchmove", e => {
  if (!touchOrigin || state.screen !== "game") return;
  const dx = e.touches[0].clientX - touchOrigin.x;
  const dy = e.touches[0].clientY - touchOrigin.y;
  held.clear();
  const DEAD = 18;
  if (Math.abs(dx) > DEAD || Math.abs(dy) > DEAD) {
    if (Math.abs(dx) > Math.abs(dy)) held.add(dx > 0 ? "right" : "left");
    else held.add(dy > 0 ? "down" : "up");
  }
  e.preventDefault();
}, { passive: false });

addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - (touchOrigin?.x ?? 0);
  const dy = e.changedTouches[0].clientY - (touchOrigin?.y ?? 0);
  if (Math.abs(dx) < 18 && Math.abs(dy) < 18 && state.screen === "game") {
    justPressed.add("interact");
  }
  held.clear();
  touchOrigin = null;
}, { passive: false });

// ─── GAME LOGIC ───────────────────────────────────────────────────────────────
function startGame() {
  Object.assign(state, {
    screen: "game",
    player: { x: 380, y: 440, vx: 0, vy: 0, facing: "down" },
    score: 0,
    answeredIds: new Set(),
    currentQuiz: null,
    quizSelected: null,
    quizResult: null,
    nearNPC: null,
    particles: [],
    footsteps: [],
    notif: null,
    camera: { x: 0, y: 0 },
  });
  for (const r of Object.values(state.rooms)) r.unlocked = r.reqScore === 0;
  buildNPCs();
}

function resetGame() { state.screen = "title"; }

function getQuizFor(room) {
  const pool = QUIZZES.filter(q => q.room === room && !state.answeredIds.has(q.q));
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}

function openQuiz(room) {
  const q = getQuizFor(room);
  if (!q) { showNotif("You've answered all questions here!", "#FFD700"); return; }
  state.currentQuiz = q;
  state.quizSelected = null;
  state.quizResult = null;
  state.screen = "quiz";
}

function selectAnswer(idx) {
  if (state.screen !== "quiz" || state.quizResult !== null || !state.currentQuiz) return;
  state.quizSelected = idx;
  const ok = idx === state.currentQuiz.correct;
  state.quizResult = ok ? "correct" : "wrong";
  state.answeredIds.add(state.currentQuiz.q);
  if (ok) {
    state.score += 2;
    spawnParticles(W / 2, H * 0.55, "#FFD700", 18);
    spawnParticles(W / 2, H * 0.55, "#00B38A", 12);
    checkUnlocks();
  }
}

function closeQuiz() {
  state.screen = "game";
  if (state.answeredIds.size >= QUIZZES.length) {
    setTimeout(() => { state.screen = "complete"; }, 600);
  }
}

function checkUnlocks() {
  for (const [, room] of Object.entries(state.rooms)) {
    if (!room.unlocked && state.score >= room.reqScore) {
      room.unlocked = true;
      showNotif("🔓 " + room.label + " unlocked!", room.ax);
      spawnParticles(W / 2, H / 2, room.ax, 40);
    }
  }
}

function showNotif(text, color) {
  state.notif = { text, color, life: 1.0 };
}

function handleQuizTouch(tx, ty) {
  const panelW = Math.min(W * 0.88, 640);
  const panelX = (W - panelW) / 2;
  const panelY = H * 0.07;
  const btnH = 56;
  const btnGap = 10;
  const btnY0 = panelY + 230;
  for (let i = 0; i < 4; i++) {
    const by = btnY0 + i * (btnH + btnGap);
    if (tx >= panelX + 8 && tx <= panelX + panelW - 8 && ty >= by && ty <= by + btnH) {
      selectAnswer(i); return;
    }
  }
}

// ─── PARTICLES ───────────────────────────────────────────────────────────────
function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1.5 + Math.random() * 5;
    state.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
      life: 1, size: 3 + Math.random() * 6, color });
  }
}

// ─── UPDATE ──────────────────────────────────────────────────────────────────
function update(dt) {
  if (state.screen !== "game") return;

  const SPEED = 3.8;
  let dx = 0, dy = 0;
  if (held.has("left"))  { dx -= SPEED; state.player.facing = "left"; }
  if (held.has("right")) { dx += SPEED; state.player.facing = "right"; }
  if (held.has("up"))    { dy -= SPEED; state.player.facing = "up"; }
  if (held.has("down"))  { dy += SPEED; state.player.facing = "down"; }
  if (dx && dy) { dx *= 0.707; dy *= 0.707; }

  state.player.x = Math.max(20, Math.min(WORLD_W - 20, state.player.x + dx));
  state.player.y = Math.max(20, Math.min(WORLD_H - 20, state.player.y + dy));
  state.player.vx = dx; state.player.vy = dy;

  // Footsteps
  if ((Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) && Math.random() < 0.12) {
    state.footsteps.push({ x: state.player.x, y: state.player.y + 14, life: 1.0 });
  }
  for (let i = state.footsteps.length - 1; i >= 0; i--) {
    state.footsteps[i].life -= 0.025;
    if (state.footsteps[i].life <= 0) state.footsteps.splice(i, 1);
  }

  // Camera
  const tx = state.player.x - W / 2, ty = state.player.y - H / 2;
  state.camera.x += (tx - state.camera.x) * 0.12;
  state.camera.y += (ty - state.camera.y) * 0.12;
  state.camera.x = Math.max(0, Math.min(WORLD_W - W, state.camera.x));
  state.camera.y = Math.max(0, Math.min(WORLD_H - H, state.camera.y));

  // NPC proximity
  state.nearNPC = null;
  let minDist = 65;
  for (const npc of state.npcs) {
    const d = Math.hypot(state.player.x - npc.x, state.player.y - npc.y);
    if (d < minDist) { minDist = d; state.nearNPC = npc; }
  }

  // Interact
  if (justPressed.has("interact") && state.nearNPC) {
    const room = state.nearNPC.quizRoom;
    if (!state.rooms[room]?.unlocked) {
      showNotif("🔒 Need " + state.rooms[room].reqScore + " pts to unlock this area!", "#FFD700");
    } else {
      openQuiz(room);
    }
  }

  // Particles
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.1;
    p.life -= 0.022;
    if (p.life <= 0) state.particles.splice(i, 1);
  }

  // Notification fade
  if (state.notif) {
    state.notif.life -= 0.012;
    if (state.notif.life <= 0) state.notif = null;
  }

  justPressed.clear();
}

// ─── DRAWING HELPERS ─────────────────────────────────────────────────────────
function rr(x, y, w, h, r, fill, stroke, sw = 2) {
  ctx.beginPath();
  if (typeof r === "number") ctx.roundRect(x, y, w, h, r);
  else ctx.roundRect(x, y, w, h, r);
  if (fill)  { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.stroke(); }
}

function txt(text, x, y, size, color, align = "left", bold = false, italic = false) {
  ctx.fillStyle = color;
  ctx.font = `${italic ? "italic " : ""}${bold ? "bold " : ""}${size}px 'Segoe UI', Arial, sans-serif`;
  ctx.textAlign = align;
  ctx.fillText(text, x, y);
}

function wrapText(text, x, y, maxW, size, color, align = "center", leading = 1.35) {
  ctx.font = `${size}px 'Segoe UI', Arial, sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  const words = text.split(" ");
  let line = "";
  let lineY = y;
  for (const word of words) {
    const test = line + (line ? " " : "") + word;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, lineY);
      line = word; lineY += size * leading;
    } else line = test;
  }
  if (line) ctx.fillText(line, x, lineY);
  return lineY;
}

function drawWorld() {
  ctx.save();
  ctx.translate(-state.camera.x, -state.camera.y);

  // World background
  ctx.fillStyle = "#06101E";
  ctx.fillRect(0, 0, WORLD_W, WORLD_H);

  // Rooms
  drawLobby();
  drawExecutive();
  drawMarketing();
  drawETF();
  drawHistory();
  drawCorridors();

  // Locked overlays
  for (const [, room] of Object.entries(state.rooms)) {
    if (!room.unlocked) {
      ctx.fillStyle = room.color;
      ctx.fillRect(room.x, room.y, room.w, room.h);
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(room.x, room.y, room.w, room.h);
      // Lock icon
      const cx = room.x + room.w / 2, cy = room.y + room.h / 2;
      ctx.font = "40px serif"; ctx.textAlign = "center";
      ctx.fillStyle = room.ax + "88";
      ctx.fillText("🔒", cx, cy - 10);
      txt(room.label, cx, cy + 35, 16, room.ax + "88", "center", true);
      txt("Need " + room.reqScore + " pts", cx, cy + 58, 13, "#66666688", "center");
    }
  }

  // Footsteps
  for (const fs of state.footsteps) {
    ctx.globalAlpha = fs.life * 0.35;
    ctx.fillStyle = "#E8734A";
    ctx.beginPath(); ctx.ellipse(fs.x, fs.y, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // NPCs
  for (const npc of state.npcs) drawNPC(npc);

  // Player
  drawPlayer();

  // Particles (in world space)
  for (const p of state.particles) {
    ctx.globalAlpha = p.life * 0.9;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x + state.camera.x, p.y + state.camera.y, p.size, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function chart(x, y, w, h) {
  const pts = [0.4, 0.6, 0.5, 0.7, 0.55, 0.8, 0.65, 0.9, 0.7, 0.85];
  ctx.strokeStyle = "#F39C12"; ctx.lineWidth = 2;
  ctx.beginPath();
  pts.forEach((p, i) => {
    const px = x + (i / (pts.length - 1)) * w;
    const py = y + h - p * h;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  });
  ctx.stroke();
  // Fill under line
  ctx.strokeStyle = "transparent";
  ctx.fillStyle = "rgba(243,156,18,0.08)";
  ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h);
  ctx.closePath(); ctx.fill();
}

// ─── NPC RENDERING ───────────────────────────────────────────────────────────
function drawNPC(npc) {
  const near = state.nearNPC?.id === npc.id;
  const t = Date.now() / 500;
  const bob = Math.sin(t + npc.x * 0.02) * 2.5;

  // Shadow
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.ellipse(npc.x, npc.y + 18, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  // Body
  rr(npc.x - 14, npc.y - 30 + bob, 28, 36, 7, npc.color);

  // Head
  ctx.fillStyle = npc.special ? "#FFE0B2" : "#FFDDC1";
  ctx.beginPath(); ctx.arc(npc.x, npc.y - 38 + bob, 14, 0, Math.PI * 2); ctx.fill();

  // Eyes
  ctx.fillStyle = "#2C1810";
  ctx.beginPath(); ctx.arc(npc.x - 5, npc.y - 40 + bob, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(npc.x + 5, npc.y - 40 + bob, 2.5, 0, Math.PI * 2); ctx.fill();

  // Smile
  ctx.strokeStyle = "#2C1810"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(npc.x, npc.y - 36 + bob, 5, 0.2, Math.PI - 0.2); ctx.stroke();

  // Special crown
  if (npc.special) {
    ctx.fillStyle = "#FFD700";
    ctx.beginPath();
    ctx.moveTo(npc.x - 12, npc.y - 50 + bob);
    ctx.lineTo(npc.x - 8, npc.y - 60 + bob);
    ctx.lineTo(npc.x, npc.y - 55 + bob);
    ctx.lineTo(npc.x + 8, npc.y - 60 + bob);
    ctx.lineTo(npc.x + 12, npc.y - 50 + bob);
    ctx.closePath(); ctx.fill();
  }

  // Name tag
  if (near) {
    const tagW = Math.min(npc.name.length * 7.5 + 24, 220);
    rr(npc.x - tagW / 2, npc.y - 78 + bob, tagW, 24, 6, "rgba(0,0,0,0.85)", npc.color, 1.5);
    txt(npc.name, npc.x, npc.y - 59 + bob, 11, "#fff", "center");
    // Interact prompt — pulse
    const pa = 0.75 + 0.25 * Math.sin(Date.now() / 300);
    ctx.globalAlpha = pa;
    rr(npc.x - 55, npc.y + 22, 110, 24, 6, "#00B38A88", "#00B38A", 1.5);
    txt("[ E ] Talk", npc.x, npc.y + 38, 11, "#fff", "center", true);
    ctx.globalAlpha = 1;
  }
}

  const moving = Math.abs(p.vx) > 0.1 || Math.abs(p.vy) > 0.1;

  ctx.globalAlpha = 0.35;
  ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.ellipse(p.x, p.y + 18, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  // Body — coral orange (pops against navy)
  rr(p.x - 14, p.y - 30 + bob, 28, 36, 7, "#E8734A");

  // Head
  ctx.fillStyle = "#FFDDC1";
  ctx.beginPath(); ctx.arc(p.x, p.y - 38 + bob, 14, 0, Math.PI * 2); ctx.fill();

  // Eyes
  ctx.fillStyle = "#2C1810";
  ctx.beginPath(); ctx.arc(p.x - 5, p.y - 40 + bob, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(p.x + 5, p.y - 40 + bob, 2.5, 0, Math.PI * 2); ctx.fill();

    ctx.globalAlpha = 1;
  }
}

  // Start button — pulse
  const pulse = 0.75 + 0.25 * Math.sin(Date.now() / 450);
  ctx.globalAlpha = pulse;
  rr(cx - 160, cy + 158, 320, 56, 16, "#00B38A", "#00E5B0", 2);
  ctx.globalAlpha = 1;
  txt(STR.start, cx, cy + 194, 17, "#FFFFFF", "center", true);

  // How to play
  rr(cx - 200, cy + 230, 400, 56, 10, "rgba(8,18,34,0.8)", "#1A3A5A", 1);
  txt("WASD / Arrow keys to move", cx, cy + 252, 13, "#4A7AAA", "center");
  txt("E / Space / Tap to interact with NPCs", cx, cy + 274, 13, "#4A7AAA", "center");

  // Footer
  txt("€2,398bn AUM  •  +€88bn record inflows in 2025  •  A+ Fitch rating", cx, H - 20, 12, "#2A4A6A", "center");
}

// ─── QUIZ SCREEN ─────────────────────────────────────────────────────────────
function drawQuiz() {
  const q = state.currentQuiz;
  if (!q) return;

  ctx.fillStyle = "rgba(0,0,0,0.78)"; ctx.fillRect(0, 0, W, H);

  const panelW = Math.min(W * 0.88, 640);
  const panelX = (W - panelW) / 2;
  const panelY = Math.max(H * 0.04, 20);

  // Panel
  rr(panelX, panelY, panelW, H - panelY * 2, 18, "#0B1B30", "#00B38A", 2);

  // Header strip
  rr(panelX, panelY, panelW, 52, [18, 18, 0, 0], "rgba(0,179,138,0.15)", "#00B38A", 1);
  txt("★ " + STR.quiz_title, panelX + panelW / 2, panelY + 33, 18, "#00B38A", "center", true);

  // Room badge
  const roomMeta = {
    lobby:     { label: "Main Lobby",           color: "#5A8AB0" },
    executive: { label: "Executive Suite",      color: "#FFD700" },
    marketing: { label: "Marketing & Products", color: "#E74C3C" },
    etf:       { label: "ETF & Technology",     color: "#F39C12" },
    history:   { label: "History Room",         color: "#BDC3C7" },
  };
  const rm = roomMeta[q.room];
  rr(panelX + 10, panelY + 60, panelW - 20, 30, 8, rm.color + "18", rm.color, 1);
  txt("📍 " + rm.label, panelX + panelW / 2, panelY + 81, 13, rm.color, "center");

  // Question
  const qY = panelY + 110;
  ctx.fillStyle = "#FFF";
  ctx.font = "bold 17px 'Segoe UI', Arial, sans-serif";
  ctx.textAlign = "center";
  const qWords = q.q.split(" ");
  let qLine = "", qLines = [];
  for (const w of qWords) {
    const t = qLine + (qLine ? " " : "") + w;
    if (ctx.measureText(t).width > panelW - 44) { qLines.push(qLine); qLine = w; } else qLine = t;
  }
  if (qLine) qLines.push(qLine);
  qLines.forEach((l, i) => ctx.fillText(l, panelX + panelW / 2, qY + i * 26));

  // Answer buttons
  const btnH = 56, btnGap = 10;
  const btnY0 = qY + Math.max(qLines.length * 26, 30) + 22;
  const ansColors  = ["#0A1E3A", "#0A2A1E", "#1E1A00", "#1E0A18"];
  const ansAccents = ["#2A6AB0", "#27AE60", "#F39C12", "#9B59B6"];
  const letters    = ["A", "B", "C", "D"];

  q.a.forEach((ans, i) => {
    const by = btnY0 + i * (btnH + btnGap);
    let bg = ansColors[i % 4], border = ansAccents[i % 4];
    if (state.quizResult !== null) {
      if (i === q.correct)       { bg = "#0A3A1A"; border = "#00B38A"; }
      else if (i === state.quizSelected) { bg = "#3A0A0A"; border = "#E74C3C"; }
    }
    rr(panelX + 8, by, panelW - 16, btnH, 12, bg, border, 1.5);
    // Letter badge
    rr(panelX + 16, by + 12, 32, 32, 8, border + "33", border, 1);
    txt(letters[i], panelX + 32, by + 33, 14, border, "center", true);
    // Answer text — wrap
    ctx.fillStyle = "#DDD"; ctx.font = "14px 'Segoe UI', Arial, sans-serif"; ctx.textAlign = "left";
    const maxAns = panelW - 70;
    let aLine = "", aLines = [];
    for (const w of ans.split(" ")) {
      const t = aLine + (aLine ? " " : "") + w;
      if (ctx.measureText(t).width > maxAns) { aLines.push(aLine); aLine = w; } else aLine = t;
    }
    if (aLine) aLines.push(aLine);
    aLines.forEach((l, j) => ctx.fillText(l, panelX + 56, by + 22 + j * 17));
  });

  // Result area
  if (state.quizResult !== null) {
    const resY = btnY0 + 4 * (btnH + btnGap) + 10;
    const ok = state.quizResult === "correct";
    rr(panelX + 8, resY, panelW - 16, 30, 8, ok ? "#0A3A1A" : "#3A0A0A", ok ? "#00B38A" : "#E74C3C", 1.5);
    txt(ok ? STR.correct : STR.wrong, panelX + panelW / 2, resY + 20, 14, ok ? "#00B38A" : "#E74C3C", "center", true);
    // Fact
    const factY = resY + 38;
    rr(panelX + 8, factY, panelW - 16, 60, 8, "rgba(0,179,138,0.07)", "#1A5A4A", 1);
    ctx.fillStyle = "#88C8B0"; ctx.font = "italic 12px 'Segoe UI', Arial, sans-serif"; ctx.textAlign = "center";
    const fw = panelW - 40;
    const fWords = q.fact.split(" "); let fLine = "", fLines = [];
    for (const w of fWords) {
      const t = fLine + (fLine ? " " : "") + w;
      if (ctx.measureText(t).width > fw) { fLines.push(fLine); fLine = w; } else fLine = t;
    }
    if (fLine) fLines.push(fLine);
    fLines.slice(0, 3).forEach((l, i) => ctx.fillText(l, panelX + panelW / 2, factY + 16 + i * 16));
    // Continue button
    const contY = factY + 68;
    const pa = 0.8 + 0.2 * Math.sin(Date.now() / 350);
    ctx.globalAlpha = pa;
    rr(panelX + panelW / 2 - 100, contY, 200, 42, 12, "#00B38A", "#00E5B0", 2);
    ctx.globalAlpha = 1;
    txt("Continue →", panelX + panelW / 2, contY + 27, 15, "#FFF", "center", true);
    if (justPressed.has("interact") || justPressed.has("confirm")) closeQuiz();
  } else {
    txt("Press 1–4 or tap an answer", panelX + panelW / 2, btnY0 - 8, 12, "#3A6A9A", "center");
  }
}

// ─── COMPLETE SCREEN ─────────────────────────────────────────────────────────
function drawComplete() {
  ctx.fillStyle = "rgba(0,0,0,0.88)"; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(W * 0.88, 560), px = (W - pw) / 2, py = H / 2 - 240;

  rr(px, py, pw, 480, 22, "#0B1B30", "#00B38A", 2);

  ctx.font = "64px serif"; ctx.textAlign = "center";
  ctx.fillText("🏆", W / 2, py + 82);

  txt(STR.complete, W / 2, py + 130, 34, "#FFD700", "center", true);
  txt(STR.complete_sub, W / 2, py + 164, 17, "#8AAAC0", "center");

  rr(px + 20, py + 182, pw - 40, 64, 12, "rgba(0,179,138,0.08)", "#00B38A", 1);
  txt("Final Score", W / 2, py + 208, 13, "#4A9A8A", "center");
  txt(state.score + " Knowledge Points", W / 2, py + 236, 26, "#00B38A", "center", true);

  txt("You mastered Amundi HQ, met 17 colleagues, and", W / 2, py + 284, 14, "#8AAAC0", "center");
  txt("explored the Marketing & Products team in depth!", W / 2, py + 306, 14, "#E74C3C", "center");

  rr(px + 20, py + 322, pw - 40, 90, 10, "rgba(10,20,35,0.8)", "#1A3A5A", 1);
  txt("🎯 Head of M&P: Gilles Cutaya (since Jan 2025)", W / 2, py + 346, 13, "#E74C3C", "center");
  txt("📊 €2,398 billion AUM as of 31 March 2026", W / 2, py + 368, 13, "#FFD700", "center");
  txt("🌍 200M+ clients across 35+ countries", W / 2, py + 390, 13, "#00B38A", "center");
  txt("⭐ A+ Fitch rating for 9 consecutive years", W / 2, py + 412, 13, "#9B59B6", "center");

  const pa = 0.8 + 0.2 * Math.sin(Date.now() / 400);
  ctx.globalAlpha = pa;
  rr(W / 2 - 110, py + 424, 220, 46, 14, "#00B38A", "#00E5B0", 2);
  ctx.globalAlpha = 1;
  txt(STR.play_again, W / 2, py + 453, 17, "#FFF", "center", true);
}

// ─── MAIN LOOP ───────────────────────────────────────────────────────────────
const STEP = 1000 / 60;
let acc = 0, last = performance.now(), paused = false;
let frames = 0, fpsAt = last, fps = 0;
addEventListener("blur",  () => paused = true);
addEventListener("focus", () => { paused = false; last = performance.now(); });

const dev = new URLSearchParams(location.search).has("dev");
if (dev) document.getElementById("dev").style.display = "block";

function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { last = now; return; }
  acc += now - last; last = now;
  while (acc >= STEP) { update(STEP); acc -= STEP; }

  ctx.clearRect(0, 0, W, H);

  if (state.screen === "title") {
    drawTitle();
    if (justPressed.has("interact") || justPressed.has("confirm")) startGame();
  } else if (state.screen === "game" || state.screen === "quiz") {
    drawWorld();
    drawHUD();
    if (state.screen === "quiz") drawQuiz();
  } else if (state.screen === "complete") {
    drawWorld();
    drawComplete();
  }

  if (dev && (frames++, now - fpsAt >= 500)) {
    fps = Math.round(frames * 1000 / (now - fpsAt)); frames = 0; fpsAt = now;
    document.getElementById("dev").textContent = fps + " fps";
  }

  justPressed.clear();
}

requestAnimationFrame(frame);
</script>
